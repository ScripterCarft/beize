# What Beize consists of. Target dependencies (glibc, ...) are included
# automatically; build-only files are filtered out.

# The /usr image.
packages = ["gcc-runtime", "systemd", "dbus", "util-linux", "e2fsprogs", "bash", "coreutils", "beize-setup",
            "tzdata", "ca-certificates", "ntpd-rs"]

# The initrd in the UKI: finds /usr, creates the root partition on first boot
# (systemd-repart, mkfs.ext4) and mounts it. bash runs Beize's own initrd
# scripts (recovery key, system/initrd); there are no coreutils.
initrd = ["gcc-runtime", "systemd", "util-linux", "e2fsprogs", "bash", "beize-tpm"]
