# What Beize consists of. Target dependencies (glibc, ...) are included
# automatically; build-only files are filtered out. The initrd: initrd.toml.

# The /usr image. All kernel modules go in (/usr/lib/modules).
packages = ["gcc-runtime", "systemd", "dbus", "util-linux", "e2fsprogs", "bash", "coreutils", "beize-setup",
            "tzdata", "ca-certificates", "ntpd-rs", "kmod", "beize-tpm",
            # Keyboard (ADR 0017): layouts, localed's check of them, console keymaps.
            "xkeyboard-config", "libxkbcommon", "kbd",
            # Privileges (ADR 0018): run0, authorized by polkit.
            "polkit",
            # Accounts (ADR 0019): Beize's account service and beize-account.
            "beize-accounts",
            # Network diagnosis without privileges (ADR 0018): ping, tracepath.
            "iputils",
            # Updates (ADR 0020): Beize's updater, its fetcher, beize-update.
            "beize-update"]
