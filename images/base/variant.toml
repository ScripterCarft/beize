# The base (ADR 0025): a complete Beize without a user interface – what
# every variant consists of. Target dependencies (glibc, ...) are included
# automatically; build-only files are filtered out. The initrd, the same
# for every variant: images/initrd.toml.

# VARIANT= in os-release.
name = "Basis"

# The /usr image. All kernel modules go in (/usr/lib/modules).
packages = ["gcc-runtime", "systemd", "dbus", "dbus-broker", "util-linux", "e2fsprogs", "bash", "coreutils", "beize-setup",
            "tzdata", "ca-certificates", "ntpd-rs", "kmod", "beize-tpm",
            # Keyboard (ADR 0017): layouts, localed's check of them, console keymaps.
            "xkeyboard-config", "libxkbcommon", "kbd",
            # Privileges (ADR 0018): run0, authorized by polkit.
            "polkit",
            # Accounts (ADR 0019): Beize's account service and beize-account.
            "beize-accounts",
            # Network diagnosis without privileges (ADR 0018): ping, tracepath.
            "iputils",
            # Block devices with labels and file systems, for every user.
            "lsblk",
            # The base tools every distribution has (POSIX and alike): text,
            # files, archives, processes, the pager, the network by hand.
            "grep", "sed", "gawk", "findutils", "diffutils", "libarchive", "gzip",
            "procps-ng", "less", "ncurses", "iproute2",
            # The text editor (the owner's choice).
            "nano",
            # Updates (ADR 0020): Beize's updater, its fetcher, beize-update.
            "beize-update"]
