# The desktop (ADR 0025): the base and the user interface on top – Beize
# for a computer, what `bz` builds unless told otherwise. It only adds to
# the base: packages here, presets in system.preset, what runs in
# running-units.txt and its exposure in security.toml, each for what this
# variant brings; a file without additions is left out.

# VARIANT= in os-release.
name = "Desktop"
extends = "base"

# Graphics (ADR 0027): Vulkan with Mesa's drivers (NVK for NVIDIA) and
# Beize's compositor, which links libseat (logind hands it the devices) and
# libinput; beize-session starts it from a login; Beize UI, the toolkit of
# its own apps, with the shell and the terminal. The system fonts, the
# symbols (Phosphor, ADR 0028 §8) and the Compose tables for typing (ADR
# 0027 §9).
packages = [
  "mesa", "vulkan-loader", "beize-compositor", "beize-session", "beize-ui",
  "inter", "jetbrains-mono", "phosphor-icons", "libx11-compose",
]
