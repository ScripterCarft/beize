[workspace]
resolver = "3"
members = ["tools/bz", "os/beize-tpm", "os/beize-setup", "os/beize-accounts", "os/beize-varlink", "os/beize-update"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Every unsafe block says why it is sound (`// SAFETY:`), as in the standard
# library and Rust for Linux.
undocumented_unsafe_blocks = "deny"
# Errors are handled, not panicked on, outside tests (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
