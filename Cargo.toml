[workspace]
resolver = "3"
members = ["tools/bz", "os/beize-tpm", "os/beize-setup", "os/beize-accounts", "os/beize-varlink", "os/beize-update", "os/beize-vulkan", "os/beize-draw", "os/beize-ui", "os/beize-terminal", "os/beize-shell", "os/beize-compositor", "os/beize-testclient", "os/beize-session", "os/beize-systemd", "os/beize-protocols"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MPL-2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# cargo-fuzz builds with --cfg fuzzing (fuzz/).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Every unsafe block says why it is sound (`// SAFETY:`), as in the standard
# library and Rust for Linux.
undocumented_unsafe_blocks = "deny"
# Errors are handled, not panicked on, outside tests (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"

# Tests and lints: debug information for Beize's own code only. With it for
# every crate, target/ grew to 28 GB (25.10.).
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
