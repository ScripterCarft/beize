# Beize ships only /usr; /etc is populated from the factory defaults on first
# boot and never overwritten afterwards (ADR 0007).
C /etc/profile - - - -
C /etc/ld.so.conf - - - -
# ntpd-rs reads /etc/ntpd-rs/ntp.toml: Beize's sources unless the owner
# replaces the link with a file of their own (ADR 0012).
L /etc/ntpd-rs/ntp.toml - - - - ../../usr/lib/ntpd-rs/ntp.toml
# nano reads /etc/nanorc: Beize's settings (syntax highlighting), the same way.
L /etc/nanorc - - - - ../usr/lib/nano/nanorc
# The trusted root certificates (ADR 0012): OpenSSL's default file and the
# path most other programs look at first.
L /etc/ssl/cert.pem - - - - ../../usr/share/ca-certificates/ca-bundle.pem
L /etc/ssl/certs/ca-certificates.crt - - - - ../../../usr/share/ca-certificates/ca-bundle.pem
