# Not in the recovery start (ADR 0018), here as in the initrd: the unit
# runs again in the system when the initrd did not create the SRK file, and
# its NvPCR setup needs the UKI's signed initrd policy, which the recovery
# profile deliberately lacks. Found on the owner's PC (real TPM): it failed
# there after the switch to the system.
[Unit]
ConditionKernelCommandLine=!beize.recovery
