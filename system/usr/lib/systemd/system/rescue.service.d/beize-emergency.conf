# Beize's emergency gate instead of sulogin (ADR 0016, os/beize-tpm/src/emergency.rs):
# restart, turn off, or an emergency shell with the recovery key only. When
# the gate ends for any reason but a restart (Ctrl+C, a crash), systemd starts
# it again: it never falls through to a shell or back into the boot.
[Unit]
StartLimitIntervalSec=0

[Service]
ExecStartPre=
ExecStart=
ExecStart=/usr/lib/beize/beize-tpm emergency
Restart=always
RestartSec=1
# The recovery key the initrd took this start (keyring.rs), if any.
KeyringMode=shared
