# Test VMs (bz run, debugging): a root shell on the serial console without a
# login prompt – only when the VM passes the credential beize.debug-console.
# Images for real hardware import no credentials (systemd.import_credentials=no),
# so there this getty never starts.
[Unit]
ConditionCredential=beize.debug-console

[Service]
ExecStart=
ExecStart=-/usr/bin/agetty --noclear --keep-baud --skip-login --login-program /usr/bin/bash --login-options -l 115200 %I vt220
