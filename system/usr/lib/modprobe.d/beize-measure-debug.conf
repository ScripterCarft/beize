# Measurement build only (measure/nouveau-edid), never on main: DRM's
# DRIVER, KMS and DP messages (AUX transfers, link training) from before
# nouveau probes, into the journal. drm is built in, so its parameter is
# set here, right before the module loads.
install nouveau echo 0x106 > /sys/module/drm/parameters/debug; /usr/bin/modprobe --ignore-install nouveau $CMDLINE_OPTS
options nouveau debug=disp=debug
