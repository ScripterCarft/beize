# systemd-boot's configuration (loader.conf(5)), part of each version of
# Beize: bz image writes it onto the ESP of an installation, a successful
# boot of a new version brings it there with the boot loader (ADR 0024).
#
# Boot the newest entry at once; the menu appears while a key is held.
timeout 0
# No command line editing (Secure Boot forbids it anyway).
editor no
# The menu sets the firmware's console to its highest mode, the display's
# own resolution. The kernel's console inherits the mode: with "keep" the
# owner's PC fell back to 1024x768 after the menu.
console-mode max
# If the firmware is in setup mode (no keys, e.g. after "clear Secure Boot
# keys" in the firmware setup), enroll Beize's keys from /loader/keys/auto –
# after a 15 s warning that a key press aborts, at once in a VM – and
# reboot (ADR 0010).
secure-boot-enroll force
