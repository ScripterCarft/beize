# Let the AskPassword varlink service see the passphrase cache in root's user
# keyring, as systemd-cryptsetup@.service does (KeyringMode=shared there).
# beize-tpm-reseal asks it for the recovery key typed into systemd-cryptsetup
# (cache only, never interactively). Only root may call the service: for the
# system instance it requires root or polkit, and the initrd has no polkit.
[Service]
KeyringMode=shared
