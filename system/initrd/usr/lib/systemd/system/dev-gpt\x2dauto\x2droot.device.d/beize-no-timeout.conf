# The root partition appears only once it is unlocked – by the TPM at once,
# or after the owner typed the recovery key, which takes as long as it takes
# (ADR 0018). systemd-gpt-auto-generator lifts the 90 s device timeout only
# for /dev/mapper/root, while sysroot.mount waits for /dev/gpt-auto-root:
# after 90 s at the key prompt the boot failed into the emergency gate.
# Distributions with the root in crypttab wait without a limit, too;
# systemd-cryptsetup handles its own timeouts. Upstream report: ~/upstream.
[Unit]
JobRunningTimeoutSec=infinity
