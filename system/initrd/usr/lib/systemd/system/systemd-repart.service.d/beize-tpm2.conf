# Bind the TPM2 slot of the root partition to the signed PCR 11 policy with
# the policy reference "initrd": only the signature the UKI carries for the
# initrd phase satisfies it, so once the initrd has left (PCR 11 extended by
# leave-initrd) not even the running system gets the key from the TPM again
# (ADR 0010). systemd-repart picks the public key up from the UKI by itself.
[Service]
ExecStart=
ExecStart=systemd-repart --dry-run=no --tpm2-public-key-policyref=initrd
