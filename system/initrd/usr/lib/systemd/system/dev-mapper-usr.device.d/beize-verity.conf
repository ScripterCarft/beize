# /dev/mapper/usr exists only once systemd-veritysetup@usr.service set it
# up. When that fails (a damaged hash tree), the device job waited the full
# 90 s device timeout before the boot failed into the emergency gate – for a
# new version on trial, 90 s per try before it falls back (ADR 0020).
# systemd-veritysetup-generator links the device to its service this way
# for veritytab entries (dev-mapper-<name>.device.requires/), but not for
# usrhash=/roothash= on the kernel command line. Upstream report: ~/upstream.
[Unit]
Requires=systemd-veritysetup@usr.service
