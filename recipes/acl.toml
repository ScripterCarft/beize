# POSIX access control lists: systemd-logind grants the logged-in user access
# to device nodes (uaccess), journald lets users read their own journal.
name = "acl"
version = "2.4.0"
stage = "target"
deps = ["gcc", "glibc", "attr"]

[source]
latest = { release-monitoring = 16 }
url = "https://download.savannah.nongnu.org/releases/acl/acl-{version}.tar.xz"
sha256 = "e661131456d2708a01c614a0f400e11d7d1bfaeb6f3e74b75bb980b72f0161a3"
signature = "https://download.savannah.nongnu.org/releases/acl/acl-{version}.tar.xz.sig"
keyring = "acl"

[build]
script = '''
"$SRC/configure" --host="$TARGET" --prefix=/usr --libdir=/usr/lib \
  --bindir=/usr/bin --disable-static --disable-nls
MAKEFLAGS="$JOBSERVER" make
make DESTDIR="$PKG" install
'''

[sbom]
# As Fedora's package states it (2026-10-13).
license = "GPL-2.0-or-later AND LGPL-2.1-or-later"
cpe = ["cpe:2.3:a:acl_project:acl"]

[files]
image = [
  "usr/bin/chacl",
  "usr/bin/getfacl",
  "usr/bin/setfacl",
  "usr/lib/libacl.so.*",
]
