# GNU core utilities (ls, cat, cp, ...).
# Separate programs, not one (--enable-single-binary): measured in the VM
# (2026-10-12) one program is 1.8 instead of 12.3 MB (/usr image -3.7 MiB),
# but each call is 12-29 % slower (true 0.48 -> 0.62 ms, ls 0.63 -> 0.70 ms):
# BIND_NOW resolves the symbols of every tool at each start.
name = "coreutils"
version = "9.12"
stage = "target"
# libcap: ls --color marks files that carry capabilities. Requested
# explicitly, so configure fails instead of silently building without it.
deps = ["gcc", "glibc", "libcap"]

[source]
latest = { release-monitoring = 343 }
url = "https://mirrors.kernel.org/gnu/coreutils/coreutils-{version}.tar.xz"
sha256 = "a480198559733e9b3da999e90543ac6f888a2caa544d8d664c5a1f17e528e210"
signature = "https://mirrors.kernel.org/gnu/coreutils/coreutils-{version}.tar.xz.sig"
keyring = "coreutils"

[build]
script = '''
"$SRC/configure" \
  --host="$TARGET" --build="$("$SRC/build-aux/config.guess")" --prefix=/usr \
  --disable-nls --without-selinux --without-openssl --enable-libcap \
  --enable-install-program=hostname --enable-no-install-program=kill,uptime \
  gl_cv_macro_MB_CUR_MAX_good=y
make
make DESTDIR="$PKG" install
'''
