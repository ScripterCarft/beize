# Firmware and AMD microcode (ADR 0015). Not unpacked as a whole: bz takes
# only what it needs from the archive (microcode, firmware the modules request).
name = "linux-firmware"
version = "20261124"

[source]
latest = { release-monitoring = 141464 }
url = "https://cdn.kernel.org/pub/linux/kernel/firmware/linux-firmware-{version}.tar.xz"
sha256 = "2cabe10253005f55bf4bbc0ebb25c0964d66f7c4121ffa47853ff1e70ea1aa54"
signature = "https://cdn.kernel.org/pub/linux/kernel/firmware/linux-firmware-{version}.tar.sign"
signed = "uncompressed"
keyring = "linux-firmware"

[sbom]
# As Fedora's package states it (2026-10-13).
license = "GPL-1.0-or-later AND GPL-2.0-or-later AND MIT AND LicenseRef-Firmware"
# No CPE: CVEs about firmware name the devices, not this package.
cpe = []

[files]
omit = [
  # nouveau requests every GSP release it knows and boots the newest it finds
  # (570.144 before 535.113.01, nvkm/subdev/gsp/*.c); measured on the
  # owner's RTX 3070 Ti (ADR 0027). Remove this when nouveau drops 535.
  { path = "nvidia/*/gsp/*-535.113.01.bin", why = "older GSP release, never loaded beside 570.144 (59 MiB)" },
]
