# XML parser, required by the D-Bus daemon for its configuration.
name = "expat"
version = "2.11.0"
stage = "target"
deps = ["gcc", "glibc"]

[source]
latest = { release-monitoring = 770 }
url = "https://github.com/libexpat/libexpat/releases/download/R_2_11_0/expat-{version}.tar.xz"
sha256 = "61e7614b602201c28a189dafee78f5bceaee192bbde46a930752ff09cf5542fa"
signature = "https://github.com/libexpat/libexpat/releases/download/R_2_11_0/expat-{version}.tar.xz.asc"
keyring = "expat"

[build]
script = '''
"$SRC/configure" \
  --host="$TARGET" --prefix=/usr --libdir=/usr/lib \
  --disable-static --without-docbook --without-examples --without-tests
MAKEFLAGS="$JOBSERVER" make
make DESTDIR="$PKG" install
'''

[sbom]
# As Fedora's package states it (2026-10-13).
license = "MIT"
cpe = ["cpe:2.3:a:libexpat_project:libexpat"]

[files]
image = [
  "usr/lib/libexpat.so.*",
]
build = [
  { path = "usr/bin/xmlwf", why = "development tool: checks XML" },
]
