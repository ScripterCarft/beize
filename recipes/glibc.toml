# GNU C library. Required for binary compatibility (ADR 0002).
name = "glibc"
version = "2.44"
stage = "target"
deps = ["gcc-pass1", "linux-headers"]

[source]
latest = { release-monitoring = 5401 }
url = "https://mirrors.kernel.org/gnu/glibc/glibc-{version}.tar.xz"
sha256 = "37f600f2bef3c5e8300147059568b2a2e40a7ad6ccc65ce942556d49429cc667"
signature = "https://mirrors.kernel.org/gnu/glibc/glibc-{version}.tar.xz.sig"
keyring = "glibc"

[build]
script = '''
# Built by the bootstrap compiler (recipes/gcc-pass1.toml); the full one
# needs this glibc.
export PATH="$TOOLS/pass1/bin:$PATH"
echo "rootsbindir=/usr/bin" > configparms
# Hardening (ADR 0014) through glibc's own switches: FORTIFY, stack
# protector, BIND_NOW and CET are configure options. --enable-cet must be
# explicit: configure probes the preprocessor without CFLAGS, misses
# -fcf-protection and would compile CET code without CET support. glibc
# links itself, so no LDFLAGS; it is not C++, so no _GLIBCXX_ASSERTIONS.
# configure finds the highest FORTIFY level by linking a test program, which
# needs a C library – there is none before this build, so a build from
# scratch failed. Answered here: level 3 needs __builtin_dynamic_object_size
# (gcc 12 and later).
export CFLAGS="-O2 -pipe -fstack-clash-protection -fcf-protection \
  -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer $PREFIX_MAP"
unset CXXFLAGS LDFLAGS
# glibc is C; C++ only builds some of its tests. The bootstrap compiler is C
# only (as Buildroot's gcc-initial and crosstool-NG's core pass), so there is
# no C++ compiler – said explicitly, instead of configure finding whatever
# g++ is on the PATH.
export CXX=false
"$SRC/configure" \
  --prefix=/usr --libdir=/usr/lib --libexecdir=/usr/lib \
  --host="$TARGET" --build="$("$SRC/scripts/config.guess")" \
  --with-headers="$SYSROOT/usr/include" --enable-kernel=6.1 \
  --enable-stack-protector=strong --enable-fortify-source=3 --enable-bind-now --enable-cet \
  --disable-werror --disable-nscd \
  libc_cv_slibdir=/usr/lib \
  libc_cv_supported_fortify_source=3 libc_cv_test_supported_fortify_source=3
MAKEFLAGS="$JOBSERVER" make
make DESTDIR="$PKG" install
# Only /usr is shipped: /etc/rpc (Sun RPC names) and the nscd database
# Makefile in /var are not used by Beize.
rm -rf "$PKG/etc" "$PKG/var"
'''

[sbom]
# As Fedora's package states it (2026-10-13).
license = "LGPL-2.1-or-later AND SunPro AND LGPL-2.1-or-later WITH GCC-exception-2.0 AND BSD-3-Clause AND GPL-2.0-or-later AND LGPL-2.1-or-later WITH GNU-compiler-exception AND GPL-2.0-only AND ISC AND LicenseRef-Public-Domain AND HPND AND CMU-Mach AND LGPL-2.0-or-later AND Unicode-3.0 AND GFDL-1.1-or-later AND GPL-1.0-or-later AND FSFUL AND MIT AND Inner-Net-2.0 AND X11 AND GPL-2.0-or-later WITH GCC-exception-2.0 AND GFDL-1.3-only AND GFDL-1.1-only AND GPL-3.0-or-later AND GPL-3.0-or-later WITH Autoconf-exception-generic-3.0 AND GPL-3.0-or-later WITH Texinfo-exception"
cpe = ["cpe:2.3:a:gnu:glibc"]

[sbom.cve-ignore]
# Checked 2026-10-13; the NVD's version range for them has no end.
"CVE-2026-5435" = "fixed in 2.44 (its NEWS: bug 34033)"
"CVE-2026-6238" = "fixed in 2.44 (its NEWS: bug 34069)"

[files]
image = [
  "usr/bin/gencat",
  "usr/bin/getconf",
  "usr/bin/getent",
  "usr/bin/iconv",
  "usr/bin/iconvconfig",
  "usr/bin/ld.so",
  "usr/bin/ldconfig",
  "usr/bin/ldd",
  "usr/bin/locale",
  "usr/bin/makedb",
  "usr/bin/pldd",
  "usr/bin/sln",
  "usr/bin/tzselect",
  "usr/bin/zdump",
  "usr/bin/zic",
  "usr/lib/gconv/**",
  "usr/lib/getconf/**",
  "usr/lib/ld-linux-x86-64.so.*",
  "usr/lib/libBrokenLocale.so.*",
  "usr/lib/libanl.so.*",
  "usr/lib/libc.so.*",
  "usr/lib/libc_malloc_debug.so.*",
  "usr/lib/libdl.so.*",
  "usr/lib/libm.so.*",
  "usr/lib/libnsl.so.*",
  "usr/lib/libnss_compat.so.*",
  "usr/lib/libnss_db.so.*",
  "usr/lib/libnss_dns.so.*",
  "usr/lib/libnss_files.so.*",
  "usr/lib/libnss_hesiod.so.*",
  "usr/lib/libpthread.so.*",
  "usr/lib/libresolv.so.*",
  "usr/lib/librt.so.*",
  "usr/lib/libthread_db.so.*",
  "usr/lib/libutil.so.*",
]
build = [
  { path = "usr/bin/localedef", why = "compiles locale sources" },
  { path = "usr/bin/mtrace", why = "debugging tool, a Perl script (Beize has no Perl)" },
  { path = "usr/bin/pcprofiledump", why = "profiling tool" },
  { path = "usr/bin/sotruss", why = "debugging tool" },
  { path = "usr/bin/sprof", why = "profiling tool" },
  { path = "usr/bin/xtrace", why = "debugging tool" },
  { path = "usr/lib/audit/sotruss-lib.so", why = "debugging tool (sotruss)" },
  { path = "usr/lib/libmemusage.so", why = "profiling tool" },
  { path = "usr/lib/libmvec.so*", why = "no program links it (checked 2026-10-12)" },
  { path = "usr/lib/libpcprofile.so", why = "profiling tool" },
  { path = "usr/share/i18n/**", why = "locale sources: languages come with M3 as compiled locales" },
  { path = "usr/share/locale/**", why = "translations: Beize runs in C.UTF-8 until M3" },
]
