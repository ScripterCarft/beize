# Core system libraries (libblkid, libmount for systemd) and a few tools,
# among them login (through PAM) and sulogin (the emergency shell; checks
# root's password with libxcrypt). Built before systemd, so without udev:
# lsblk, which needs udev's database, is a recipe of its own.
name = "util-linux"
version = "2.42.4"
stage = "target"
deps = ["gcc", "glibc", "libxcrypt", "linux-pam"]

[source]
latest = { release-monitoring = 8179 }
url = "https://cdn.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-{version}.tar.xz"
sha256 = "fbd62a100ab7bb8746ba0661255c3c48185b1e9021507c624da01fbc696330ec"
signature = "https://cdn.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-{version}.tar.sign"
signed = "uncompressed"
keyring = "util-linux"

[build]
script = '''
"$SRC/configure" \
  --host="$TARGET" --prefix=/usr --libdir=/usr/lib \
  --bindir=/usr/bin --sbindir=/usr/bin --runstatedir=/run \
  --disable-all-programs \
  --enable-libuuid --enable-libblkid --enable-libmount --enable-libsmartcols \
  --enable-libfdisk \
  --enable-agetty --enable-mount --enable-dmesg \
  --enable-login --enable-sulogin --enable-nologin \
  --disable-nls --disable-static --disable-liblastlog2 --disable-pylibmount \
  --disable-makeinstall-chown --disable-makeinstall-setuid \
  --without-python --without-systemd --without-udev --without-econf \
  --without-ncurses --without-ncursesw --without-tinfo --without-readline \
  --without-btrfs --without-cryptsetup --without-libmagic \
  ADJTIME_PATH=/var/lib/hwclock/adjtime
MAKEFLAGS="$JOBSERVER" make
make DESTDIR="$PKG" install
'''

[sbom]
# As Fedora's package states it (2026-10-13).
license = "GPL-1.0-or-later AND GPL-2.0-only AND GPL-2.0-or-later AND GPL-3.0-or-later AND LGPL-2.1-or-later AND BSD-2-Clause AND BSD-3-Clause AND BSD-4-Clause-UC AND LicenseRef-Public-Domain"
cpe = ["cpe:2.3:a:kernel:util-linux", "cpe:2.3:a:util-linux_project:util-linux"]

[files]
image = [
  "usr/bin/agetty",
  "usr/bin/dmesg",
  "usr/bin/login",
  "usr/bin/mount",
  "usr/bin/nologin",
  "usr/bin/sulogin",
  "usr/bin/umount",
  "usr/lib/libblkid.so.*",
  "usr/lib/libfdisk.so.*",
  "usr/lib/libmount.so.*",
  "usr/lib/libsmartcols.so.*",
  "usr/lib/libuuid.so.*",
  "usr/share/bash-completion/**",
]
