# POSIX capabilities library, required by systemd.
name = "libcap"
version = "2.78"
stage = "target"
deps = ["gcc", "glibc"]

[source]
latest = { release-monitoring = 1569 }
url = "https://cdn.kernel.org/pub/linux/libs/security/linux-privs/libcap2/libcap-{version}.tar.xz"
sha256 = "0d621e562fd932ccf67b9660fb018e468a683d7b827541df27813228c996bb11"
signature = "https://cdn.kernel.org/pub/linux/libs/security/linux-privs/libcap2/libcap-{version}.tar.sign"
signed = "uncompressed"
keyring = "libcap"

[build]
script = '''
# libcap only builds in-tree.
cp -a "$SRC/." .
opts=(CROSS_COMPILE="$TARGET-" CC="$CC" BUILD_CC=gcc prefix=/usr lib=lib
      GOLANG=no PAM_CAP=no SHARED=yes RAISE_SETFCAP=no)
MAKEFLAGS="$JOBSERVER" make "${opts[@]}"
make "${opts[@]}" DESTDIR="$PKG" install
'''

[sbom]
# As Fedora's package states it (2026-10-13).
license = "BSD-3-Clause OR GPL-2.0-only"
cpe = ["cpe:2.3:a:libcap_project:libcap"]

[files]
image = [
  "usr/bin/capsh",
  "usr/bin/getcap",
  "usr/bin/getpcaps",
  "usr/bin/setcap",
  "usr/lib/libcap.so.*",
  "usr/lib/libpsx.so.*",
]
