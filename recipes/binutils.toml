# Cross binutils: assembler and linker for x86_64-beize-linux-gnu.
name = "binutils"
version = "2.47"
stage = "toolchain"

[source]
latest = { release-monitoring = 7981 }
url = "https://mirrors.kernel.org/gnu/binutils/binutils-{version}.tar.xz"
sha256 = "154ab23b60070e8f27013c22977f1129425d67d1e8acd6e13010e617811e4cff"
signature = "https://mirrors.kernel.org/gnu/binutils/binutils-{version}.tar.xz.sig"
keyring = "binutils"

[build]
script = '''
# No usable default sysroot: bz gives each build its own (see gcc.toml).
"$SRC/configure" \
  --prefix="$TOOLS" --target="$TARGET" --with-sysroot="$TOOLS/no-sysroot" \
  --disable-nls --disable-werror --enable-gprofng=no \
  --enable-new-dtags --enable-default-hash-style=gnu
MAKEFLAGS="$JOBSERVER" make
make install
'''

[sbom]
# As Fedora's package states it (2026-10-13).
license = "GPL-3.0-or-later AND (GPL-3.0-or-later WITH Bison-exception-2.2) AND (LGPL-2.0-or-later WITH GCC-exception-2.0) AND BSD-3-Clause AND GFDL-1.3-or-later AND GPL-2.0-or-later AND LGPL-2.1-or-later AND LGPL-2.0-or-later"
cpe = ["cpe:2.3:a:gnu:binutils"]
