# Beize's own TPM helper (os/beize-tpm, ADR 0010, ADR 0016): checks the
# measured Secure Boot state, re-binds the root partition after a
# recovery-key unlock, guards the emergency shell (initrd and system) and
# keeps the console keymap for the initrd (ADR 0017).
name = "beize-tpm"
version = "0.1.0"
stage = "target"
# libgcc_s for Rust's unwinding; libcryptsetup checks the recovery key.
deps = ["gcc", "glibc", "gcc-runtime", "cryptsetup"]
repo = ["os/beize-tpm", "Cargo.toml", "Cargo.lock"]

[build]
script = '''
# Crates come from crates.io, checked against the checksums in Cargo.lock;
# the build itself runs offline.
"$CARGO" fetch --locked --manifest-path "$REPO/Cargo.toml"
MAKEFLAGS="$JOBSERVER" "$CARGO" build --offline --locked --release --manifest-path "$REPO/Cargo.toml" \
  -p beize-tpm --target x86_64-unknown-linux-gnu
install -D -m 755 "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/beize-tpm" \
  "$PKG/usr/lib/beize/beize-tpm"
'''

[files]
image = [
  "usr/lib/beize/**",
]
