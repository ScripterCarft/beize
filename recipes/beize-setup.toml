# Beize's first-boot setup on the console (os/beize-setup): keyboard layout,
# the owner's account; until the graphical onboarding replaces it.
name = "beize-setup"
version = "0.1.0"
stage = "target"
# libgcc_s for Rust's unwinding. It has the account created by Beize's
# account service (beize-accounts): libsystemd (sd-json) for the replies,
# libxcrypt linked by the same library.
deps = ["gcc", "glibc", "gcc-runtime", "libxcrypt", "systemd"]
repo = ["os/beize-setup", "os/beize-accounts", "Cargo.toml", "Cargo.lock"]

[build]
script = '''
"$CARGO" fetch --locked --manifest-path "$REPO/Cargo.toml"
"$CARGO" build --offline --locked --release --manifest-path "$REPO/Cargo.toml" \
  -p beize-setup --target x86_64-unknown-linux-gnu
install -D -m 755 "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/beize-setup" \
  "$PKG/usr/lib/beize/beize-setup"
'''
