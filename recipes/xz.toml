# LZMA library: systemd builds systemd-sysupdate only together with importd,
# which requires it (ADR 0020). And xz with its scripts (xzgrep, xzless, ...),
# as Fedora's xz; the small decoders and the lzma names are packages of their
# own there (xz-lzma-compat).
name = "xz"
version = "5.8.4"
stage = "target"
deps = ["gcc", "glibc"]

[source]
latest = { release-monitoring = 5277 }
url = "https://github.com/tukaani-project/xz/releases/download/v{version}/xz-{version}.tar.xz"
sha256 = "4ce24038fd4221e0d13bc1a2de7a4db56e90b92b3bf75321f6c14be73f65de4b"
signature = "https://github.com/tukaani-project/xz/releases/download/v{version}/xz-{version}.tar.xz.sig"
keyring = "xz"

[build]
script = '''
"$SRC/configure" \
  --host="$TARGET" --prefix=/usr --libdir=/usr/lib --disable-static \
  --disable-xzdec --disable-lzmadec --disable-lzmainfo \
  --disable-lzma-links --disable-doc --disable-nls
MAKEFLAGS="$JOBSERVER" make
make DESTDIR="$PKG" install
rm -rf "$PKG/usr/share/man"
'''

[sbom]
# As Fedora's package states it (2026-10-13).
license = "0BSD AND GPL-2.0-or-later AND LicenseRef-Public-Domain"
cpe = ["cpe:2.3:a:tukaani:xz", "cpe:2.3:a:xz_project:xz"]

[files]
image = [
  "usr/bin/unxz",
  "usr/bin/xz",
  "usr/bin/xzcat",
  "usr/bin/xzcmp",
  "usr/bin/xzdiff",
  "usr/bin/xzegrep",
  "usr/bin/xzfgrep",
  "usr/bin/xzgrep",
  "usr/bin/xzless",
  "usr/bin/xzmore",
  "usr/lib/liblzma.so.*",
]
