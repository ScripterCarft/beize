# LZMA library: systemd builds systemd-sysupdate only together with importd,
# which requires it (ADR 0020). Only the shared library; no xz tools.
name = "xz"
version = "5.8.4"
stage = "target"
deps = ["gcc", "glibc"]

[source]
latest = { release-monitoring = 5277 }
url = "https://github.com/tukaani-project/xz/releases/download/v{version}/xz-{version}.tar.xz"
sha256 = "4ce24038fd4221e0d13bc1a2de7a4db56e90b92b3bf75321f6c14be73f65de4b"
signature = "https://github.com/tukaani-project/xz/releases/download/v{version}/xz-{version}.tar.xz.sig"
keyring = "xz"

[build]
script = '''
"$SRC/configure" \
  --host="$TARGET" --prefix=/usr --libdir=/usr/lib --disable-static \
  --disable-xz --disable-xzdec --disable-lzmadec --disable-lzmainfo \
  --disable-lzma-links --disable-scripts --disable-doc --disable-nls
make
make DESTDIR="$PKG" install
rm -rf "$PKG/usr/share/man"
'''
