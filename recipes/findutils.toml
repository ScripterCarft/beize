# GNU find and xargs.
name = "findutils"
version = "4.11.0"
stage = "target"
deps = ["gcc", "glibc"]

[source]
latest = { release-monitoring = 812 }
url = "https://mirrors.kernel.org/gnu/findutils/findutils-{version}.tar.xz"
sha256 = "bfd19cb06cc71f3352d567e90284d8cdac02ac89774bbeadf0b533b0c11432fd"
signature = "https://mirrors.kernel.org/gnu/findutils/findutils-{version}.tar.xz.sig"
keyring = "findutils"

[build]
script = '''
"$SRC/configure" \
  --host="$TARGET" --build="$("$SRC/build-aux/config.guess")" --prefix=/usr \
  --libexecdir=/usr/lib --localstatedir=/var/lib/locate --disable-nls --without-selinux
MAKEFLAGS="$JOBSERVER" make
make DESTDIR="$PKG" install
'''

[sbom]
# As Fedora's package states it (2026-10-15).
license = "GPL-3.0-or-later"
cpe = ["cpe:2.3:a:gnu:findutils"]

[files]
image = [
  "usr/bin/find",
  "usr/bin/xargs",
]
build = [
  { path = "usr/bin/locate", why = "needs a database nothing in Beize keeps up to date (Fedora leaves it out too)" },
  { path = "usr/bin/updatedb", why = "writes locate's database" },
  { path = "usr/lib/frcode", why = "part of updatedb" },
]
