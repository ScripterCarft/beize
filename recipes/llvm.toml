# LLVM as the JIT of lavapipe (ADR 0027): Mesa's Vulkan on the CPU
# translates shaders into x86 code at run time. Only what that needs: the
# x86 backend, one shared libLLVM (as Fedora ships it), no clang and no
# tools. With RTTI, as Mesa's C++ is built with it. The library holds only
# the components Mesa asks for (its meson.build: llvm_modules for llvmpipe,
# coroutines and lto as optional) plus passes and target, whose C API
# (LLVMRunPasses, LLVMCreateTargetData) Mesa calls; LLVM adds what they
# depend on. 77 instead of 94 MB; a missing symbol fails Mesa's link.
name = "llvm"
version = "23.1.3"
stage = "target"
deps = ["gcc", "glibc", "gcc-runtime"]

[source]
latest = { release-monitoring = 1830 }
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-{version}/llvm-project-{version}.src.tar.xz"
sha256 = "c44186a7762ed28954be72e5ff6df9808e0779d4f1bf014ecc4e7e211d31ee34"
signature = "https://github.com/llvm/llvm-project/releases/download/llvmorg-{version}/llvm-project-{version}.src.tar.xz.sig"
keyring = "llvm"

[build]
# TableGen runs while building, so LLVM builds it a second time for the
# build machine (CMake's cross-compiling branch); that nested build gets
# the host's compilers, not the target's flags. A compiler on LLVM's C++
# takes up to ~1.5 GiB: as many at once as the build's memory limit holds
# (24 on 16 GiB thrashed, 45 min per file), one link at a time (libLLVM).
# CMake takes the assembler's flags from ASMFLAGS, not CFLAGS: without
# -fcf-protection BLAKE3's assembly lacks its CET marker, and libLLVM with it.
script = '''
limit=$(cat "/sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup)/memory.max" 2>/dev/null || echo max)
if [ "$limit" = max ]; then
  limit=$(( $(awk '/^MemAvailable:/ { print $2 }' /proc/meminfo) * 1024 ))
fi
compile_jobs=$(( limit / (1536 * 1024 * 1024) ))
[ "$compile_jobs" -ge 1 ] || compile_jobs=1
cmake -S "$SRC/llvm" -B . -G Ninja \
  -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
  -DCMAKE_SYSROOT="$SYSROOT" -DCMAKE_C_COMPILER="$TARGET-gcc" -DCMAKE_CXX_COMPILER="$TARGET-g++" \
  -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DLLVM_LIBDIR_SUFFIX= \
  -DCMAKE_ASM_FLAGS="$CFLAGS" \
  -DCROSS_TOOLCHAIN_FLAGS_NATIVE="-DCMAKE_C_COMPILER=gcc;-DCMAKE_CXX_COMPILER=g++;-DCMAKE_C_FLAGS=;-DCMAKE_CXX_FLAGS=;-DCMAKE_EXE_LINKER_FLAGS=" \
  -DLLVM_HOST_TRIPLE=x86_64-pc-linux-gnu -DLLVM_TARGETS_TO_BUILD=X86 \
  -DLLVM_BUILD_LLVM_DYLIB=ON -DLLVM_LINK_LLVM_DYLIB=ON -DLLVM_ENABLE_RTTI=ON \
  -DLLVM_DYLIB_COMPONENTS="bitwriter;mcdisassembler;core;executionengine;scalaropts;transformutils;instcombine;native;mcjit;coroutines;lto;passes;target" \
  -DLLVM_BUILD_TOOLS=OFF -DLLVM_BUILD_UTILS=OFF \
  -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF \
  -DLLVM_INCLUDE_DOCS=OFF -DLLVM_ENABLE_BINDINGS=OFF \
  -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_ZSTD=OFF -DLLVM_ENABLE_LIBXML2=OFF \
  -DLLVM_ENABLE_LIBEDIT=OFF -DLLVM_ENABLE_LIBPFM=OFF -DLLVM_ENABLE_FFI=OFF \
  -DLLVM_PARALLEL_COMPILE_JOBS="$compile_jobs" -DLLVM_PARALLEL_LINK_JOBS=1
MAKEFLAGS="$JOBSERVER" cmake --build . --target LLVM
DESTDIR="$PKG" cmake --build . --target install-LLVM install-llvm-headers
'''

[sbom]
# As Fedora's package states it (2026-10-17).
license = "Apache-2.0 WITH LLVM-exception OR NCSA"
cpe = ["cpe:2.3:a:llvm:llvm"]

[files]
image = [
  "usr/lib/libLLVM.so.*",
]
