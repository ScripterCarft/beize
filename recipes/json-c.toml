# JSON parser, required by cryptsetup for LUKS2 metadata.
name = "json-c"
version = "0.19"
stage = "target"
deps = ["gcc", "glibc"]

# json-c publishes no signatures at all (neither release archives nor tags,
# checked 2026-10-07), so it is only pinned.
[source]
latest = { release-monitoring = 1477 }
git = "https://github.com/json-c/json-c.git"
tag = "json-c-{version}-20260627"
commit = "aa716cd8d663c976b99b0f30f102ee1d8ef63146"
unsigned = "json-c publishes neither signed releases nor signed tags; pinned to the commit of the release tag, the same one Arch Linux builds"

[build]
script = '''
cmake -S "$SRC" -B . -G Ninja \
  -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
  -DCMAKE_SYSROOT="$SYSROOT" -DCMAKE_C_COMPILER="$TARGET-gcc" \
  -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib \
  -DBUILD_SHARED_LIBS=ON -DBUILD_STATIC_LIBS=OFF -DBUILD_TESTING=OFF -DBUILD_APPS=OFF
MAKEFLAGS="$JOBSERVER" cmake --build .
DESTDIR="$PKG" cmake --install .
'''

[sbom]
# As Fedora's package states it (2026-10-13).
license = "MIT"
cpe = ["cpe:2.3:a:json-c_project:json-c", "cpe:2.3:a:json-c:json-c"]

[files]
image = [
  "usr/lib/libjson-c.so.*",
]
