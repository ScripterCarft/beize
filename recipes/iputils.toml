# ping and tracepath (ADR 0018, phase 5c), without setuid or capabilities:
# ping uses ICMP datagram sockets, which systemd allows every group
# (net.ipv4.ping_group_range in 50-default.conf); tracepath needs no
# privileges at all. arping and clockdiff need raw sockets: not built.
# No IDN (libidn2) and no translations.
name = "iputils"
version = "20250605"
stage = "target"
deps = ["gcc", "glibc", "libcap"]

[source]
latest = { release-monitoring = 1395 }
url = "https://github.com/iputils/iputils/releases/download/{version}/iputils-{version}.tar.xz"
sha256 = "6f213700dbf96b5cc4499ca70cb15ecd69c09f405b06785bb4a1a10b572b6276"
signature = "https://github.com/iputils/iputils/releases/download/{version}/iputils-{version}.tar.xz.asc"
keyring = "iputils"

[build]
script = '''
meson setup . "$SRC" --cross-file "$MESON_CROSS" --native-file "$MESON_NATIVE" \
  --prefix=/usr --libdir=/usr/lib --sbindir=/usr/bin --buildtype=release \
  -DBUILD_PING=true -DBUILD_TRACEPATH=true \
  -DBUILD_ARPING=false -DBUILD_CLOCKDIFF=false \
  -DNO_SETCAP_OR_SUID=true -DSETCAP_OR_SUID_PING=false \
  -DUSE_CAP=true -DUSE_IDN=false -DUSE_GETTEXT=false \
  -DBUILD_MANS=false -DBUILD_HTML_MANS=false -DSKIP_TESTS=true
MAKEFLAGS="$JOBSERVER" meson compile
DESTDIR="$PKG" meson install --no-rebuild --quiet
'''

[sbom]
# As Fedora's package states it (2026-10-13).
license = "BSD-4-Clause-UC AND GPL-2.0-or-later"
cpe = ["cpe:2.3:a:iputils_project:iputils", "cpe:2.3:a:iputils:iputils"]

[files]
image = [
  "usr/bin/ping",
  "usr/bin/tracepath",
]
