# Beize UI (os/beize-ui, ADR 0027 §9): the toolkit of Beize's own apps,
# windows on Wayland drawn with Vulkan through beize-vulkan. A library;
# what goes into the image are the programs built with it, in the same
# cargo build: the shell (os/beize-shell, ADR 0028), the terminal
# (os/beize-terminal), and the test program for the VM.
#
# Built apart from the compositor: its wayland-client goes through
# libwayland (Mesa's WSI takes the display), the compositor's test client
# stays pure Rust – in one cargo build their features would merge.
# libwayland and libvulkan are loaded at run time (dlopen), both from the
# desktop's packages; libxkbcommon (keys) is linked, as in the compositor. Build scripts of its crates, checked (CLAUDE.md §8):
# wayland-sys does nothing with dlopen, wayland-client only declares cfg
# names; beize-vulkan's compiles its shaders (recipes/beize-compositor.toml);
# the terminal's: parking_lot_core's only sets a cfg for thread sanitizers,
# signal-hook's compiles C only with a feature that stays off.
name = "beize-ui"
version = "0.1.0"
stage = "target"
# libgcc_s for Rust's unwinding.
deps = ["gcc", "glibc", "gcc-runtime", "wayland", "vulkan-loader", "libxkbcommon"]
repo = ["os/beize-vulkan", "os/beize-draw", "os/beize-ui", "os/beize-shell", "os/beize-terminal", "Cargo.toml", "Cargo.lock"]

[build]
script = '''
# Crates come from crates.io, checked against the checksums in Cargo.lock;
# the build itself runs offline.
"$CARGO" fetch --locked --manifest-path "$REPO/Cargo.toml"
MAKEFLAGS="$JOBSERVER" "$CARGO" build --offline --locked --release --manifest-path "$REPO/Cargo.toml" \
  -p beize-ui -p beize-shell -p beize-terminal --target x86_64-unknown-linux-gnu
install -D -m 755 "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/beize-shell" \
  "$PKG/usr/lib/beize/beize-shell"
install -D -m 644 "$REPO/os/beize-shell/beize-shell.service" \
  "$PKG/usr/lib/systemd/user/beize-shell.service"
install -D -m 755 "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/beize-terminal" \
  "$PKG/usr/lib/beize/beize-terminal"
# Its unit: an instance per window, which the compositor starts.
install -D -m 644 "$REPO/os/beize-terminal/app.service" \
  "$PKG/usr/lib/systemd/user/app-beize\x2dterminal@.service"
install -D -m 755 "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/beize-ui-test" \
  "$PKG/usr/lib/beize/test/beize-ui-test"
install -D -m 755 "$REPO/os/beize-terminal/tests/sample.sh" \
  "$PKG/usr/lib/beize/test/beize-terminal-sample"
'''

[sbom]
# Beize's own code (LICENSE); the crates it builds from are in Cargo.lock.
license = "MPL-2.0"

[files]
image = [
  "usr/lib/beize/beize-shell",
  "usr/lib/systemd/user/beize-shell.service",
  "usr/lib/beize/beize-terminal",
  'usr/lib/systemd/user/app-beize\x2dterminal@.service',
]
build = [
  { path = "usr/lib/beize/test/beize-ui-test", why = "checks Beize UI's window in the VM, on bz's test medium; not for computers" },
  { path = "usr/lib/beize/test/beize-terminal-sample", why = "what the smoke test shows in a terminal, on bz's test medium; not for computers" },
]
