# Minimal C/C++ cross compiler without libc, just enough to build glibc.
# Installed into a prefix of its own ($TOOLS/pass1, the bootstrap compiler
# kept apart from the final one, as in crosstool-NG): only glibc puts it on
# its PATH. In the shared prefix a rebuild of this compiler silently replaced
# the full one (recipes/gcc.toml), and every package was compiled by it.
name = "gcc-pass1"
source_from = "gcc"
stage = "toolchain"
deps = ["binutils"]

[build]
script = '''
# Beize uses /usr/lib for 64-bit libraries, not lib64.
sed -e '/m64=/s/lib64/lib/' -i "$SRC/gcc/config/i386/t-linux64"

prefix="$TOOLS/pass1"
rm -rf "$prefix"
"$SRC/configure" \
  --target="$TARGET" --prefix="$prefix" --with-sysroot="$TOOLS/no-sysroot" \
  --with-as="$TOOLS/bin/$TARGET-as" --with-ld="$TOOLS/bin/$TARGET-ld" \
  --with-glibc-version=2.44 --with-newlib --without-headers \
  --with-arch=x86-64-v3 --with-tune=generic --enable-cet \
  --enable-default-pie --enable-default-ssp --enable-linker-build-id \
  --disable-nls --disable-shared --disable-multilib --disable-threads \
  --disable-libatomic --disable-libgomp --disable-libquadmath \
  --disable-libssp --disable-libvtv --disable-libstdcxx \
  --enable-languages=c,c++
MAKEFLAGS="$JOBSERVER" make
make install

# Without libc headers gcc installs an incomplete limits.h; use the full one.
cat "$SRC"/gcc/{limitx.h,glimits.h,limity.h} \
  > "$(dirname "$("$prefix/bin/$TARGET-gcc" -print-libgcc-file-name)")/include/limits.h"
'''
