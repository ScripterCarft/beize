# Beize's compositor (os/beize-compositor, ADR 0027): Smithay with its own
# Vulkan renderer and frame loop. Runs as the user; logind hands it the
# devices through libseat. Vulkan comes at run time from the loader (dlopen),
# with NVK or lavapipe from Mesa.
#
# Build scripts of its crates, checked (CLAUDE.md §8): drm-sys and input-sys
# ship their bindings, libseat-sys and libudev-sys ask pkg-config (the
# target's, set for every recipe), wayland-sys does nothing (Wayland in pure
# Rust). libudev-sys also links a probe with the build host's rustc and
# libudev to see whether udev_hwdb_new exists: the answer depends only on the
# pinned buildroot, and Smithay does not use the hwdb.
name = "beize-compositor"
version = "0.1.0"
stage = "target"
# libgcc_s for Rust's unwinding.
deps = ["gcc", "glibc", "gcc-runtime", "systemd", "seatd", "libinput", "libxkbcommon"]
repo = ["os/beize-compositor", "Cargo.toml", "Cargo.lock"]

[build]
script = '''
# Crates come from crates.io, checked against the checksums in Cargo.lock;
# the build itself runs offline.
"$CARGO" fetch --locked --manifest-path "$REPO/Cargo.toml"
MAKEFLAGS="$JOBSERVER" "$CARGO" build --offline --locked --release --manifest-path "$REPO/Cargo.toml" \
  -p beize-compositor --target x86_64-unknown-linux-gnu
install -D -m 755 "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/beize-compositor" \
  "$PKG/usr/lib/beize/beize-compositor"
'''

[sbom]
# Beize's own code (LICENSE); the crates it builds from are in Cargo.lock.
license = "MPL-2.0"

[files]
image = [
  "usr/lib/beize/beize-compositor",
]
