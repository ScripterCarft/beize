# Full C/C++ cross compiler, built against Beize's glibc.
name = "gcc"
version = "16.2.0"
stage = "toolchain"
deps = ["binutils", "glibc"]

[source]
url = "https://mirrors.kernel.org/gnu/gcc/gcc-{version}/gcc-{version}.tar.xz"
sha256 = "e6738e29597f733270731aa90600f37ffdc045079dfc27ec7e8192cc81085c3e"
signature = "https://mirrors.kernel.org/gnu/gcc/gcc-{version}/gcc-{version}.tar.xz.sig"
keyring = "gcc"

[[extra]]
url = "https://mirrors.kernel.org/gnu/gmp/gmp-6.3.0.tar.xz"
sha256 = "a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898"
signature = "https://mirrors.kernel.org/gnu/gmp/gmp-6.3.0.tar.xz.sig"
keyring = "gmp"
dest = "gmp"

[[extra]]
url = "https://mirrors.kernel.org/gnu/mpfr/mpfr-4.2.2.tar.xz"
sha256 = "b67ba0383ef7e8a8563734e2e889ef5ec3c3b898a01d00fa0a6869ad81c6ce01"
signature = "https://mirrors.kernel.org/gnu/mpfr/mpfr-4.2.2.tar.xz.sig"
keyring = "mpfr"
dest = "mpfr"

[[extra]]
url = "https://mirrors.kernel.org/gnu/mpc/mpc-1.3.1.tar.gz"
sha256 = "ab642492f5cf882b74aa0cb730cd410a81edcdbec895183ce930e706c1c759b8"
signature = "https://mirrors.kernel.org/gnu/mpc/mpc-1.3.1.tar.gz.sig"
keyring = "mpc"
dest = "mpc"

[build]
script = '''
sed -e '/m64=/s/lib64/lib/' -i "$SRC/gcc/config/i386/t-linux64"

"$SRC/configure" \
  --target="$TARGET" --prefix="$TOOLS" --with-sysroot="$SYSROOT" \
  --with-glibc-version=2.44 \
  --enable-default-pie --enable-default-ssp \
  --enable-shared --enable-threads=posix --enable-__cxa_atexit \
  --enable-linker-build-id --disable-nls --disable-multilib \
  --disable-bootstrap --disable-libsanitizer --disable-libvtv \
  --enable-languages=c,c++
make -j"$JOBS"
make install
'''
