# D-Bus system and session bus. Required by logind and, later, the desktop.
name = "dbus"
version = "1.16.2"
stage = "target"
deps = ["gcc", "glibc", "expat", "systemd"]

[source]
latest = { release-monitoring = 5356 }
url = "https://dbus.freedesktop.org/releases/dbus/dbus-{version}.tar.xz"
sha256 = "0ba2a1a4b16afe7bceb2c07e9ce99a8c2c3508e5dec290dbb643384bd6beb7e2"
signature = "https://dbus.freedesktop.org/releases/dbus/dbus-{version}.tar.xz.asc"
keyring = "dbus"

[build]
script = '''
meson setup . "$SRC" --cross-file "$MESON_CROSS" --native-file "$MESON_NATIVE" \
  --prefix=/usr --libdir=/usr/lib --libexecdir=/usr/lib/dbus-1.0 \
  --sysconfdir=/etc --localstatedir=/var --buildtype=release \
  -Dauto_features=disabled \
  -Dsystemd=enabled -Dinotify=enabled -Depoll=enabled \
  -Duser_session=true -Dmessage_bus=true -Dtools=true \
  -Dmodular_tests=disabled -Dasserts=false \
  -Druntime_dir=/run -Dsystem_socket=/run/dbus/system_bus_socket \
  -Dsystemd_system_unitdir=/usr/lib/systemd/system \
  -Dsystemd_user_unitdir=/usr/lib/systemd/user
MAKEFLAGS="$JOBSERVER" meson compile
DESTDIR="$PKG" meson install --no-rebuild --quiet
# /etc/dbus-1/{system,session}.conf are empty legacy stubs; the real
# configuration lives in /usr/share/dbus-1.
rm -rf "$PKG/etc"
# The setuid launch helper starts system bus services without systemd. Here
# systemd starts every one (SystemdService=), and setuid is not allowed
# (ADR 0018); installed without the bit, it would only be dead weight.
rm "$PKG/usr/lib/dbus-1.0/dbus-daemon-launch-helper"
'''
