# Compression library, required by glib (GIO streams). Only the shared library.
name = "zlib"
version = "1.4"
stage = "target"
deps = ["gcc", "glibc"]

[source]
latest = { release-monitoring = 5303 }
url = "https://zlib.net/zlib-{version}.tar.xz"
sha256 = "4f11c512053d7bab8d9e9b89bde3575add3e4c50a383b42ef6cb837035fc5a7c"
signature = "https://zlib.net/zlib-{version}.tar.xz.asc"
keyring = "zlib"

[build]
script = '''
CHOST="$TARGET" "$SRC/configure" --prefix=/usr --libdir=/usr/lib --shared
MAKEFLAGS="$JOBSERVER" make
make DESTDIR="$PKG" install
'''

[sbom]
# As the project states it (LICENSE).
license = "Zlib"
cpe = ["cpe:2.3:a:zlib:zlib", "cpe:2.3:a:gnu:zlib"]

[files]
image = [
  "usr/lib/libz.so.*",
]
