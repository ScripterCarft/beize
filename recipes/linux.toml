# Linux kernel, latest stable at the time of pinning.
# Bump version and sha256 together; the hash comes from
# https://cdn.kernel.org/pub/linux/kernel/v7.x/sha256sums.asc
name = "linux"
version = "7.2.9"

[source]
latest = { kernel-org = "stable" }
url = "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-{version}.tar.xz"
sha256 = "b4c5dfbe51a364a6c7f03869200f88c8e1f77403539005f14b7fc6bc91b8d8ba"
signature = "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-{version}.tar.sign"
signed = "uncompressed"
keyring = "linux"
