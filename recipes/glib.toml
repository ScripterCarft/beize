# GLib, GObject and GIO: the base library polkit is written against (and,
# later, GTK applications). No introspection, translations or documentation.
name = "glib"
version = "2.90.1"
stage = "target"
deps = ["gcc", "glibc", "zlib", "libffi", "pcre2", "util-linux"]

# GNOME publishes only checksums for the archives; the release tags are
# signed. gvdb is a submodule, pinned by the signed tree.
[source]
latest = { release-monitoring = 10024 }
git = "https://gitlab.gnome.org/GNOME/glib.git"
tag = "{version}"
commit = "e05063ccc6c8f222465a1080927f4c14349f3de6"
submodules = true
keyring = "glib"

[build]
script = '''
meson setup . "$SRC" --cross-file "$MESON_CROSS" --native-file "$MESON_NATIVE" \
  --prefix=/usr --libdir=/usr/lib --buildtype=release --wrap-mode=nodownload \
  -Ddefault_library=shared \
  -Dselinux=disabled -Dlibmount=enabled -Dxattr=true \
  -Dman-pages=disabled -Ddocumentation=false -Dintrospection=disabled \
  -Dnls=disabled -Dsysprof=disabled -Ddtrace=disabled -Dsystemtap=disabled \
  -Dtests=false -Dinstalled_tests=false -Dglib_debug=disabled
MAKEFLAGS="$JOBSERVER" meson compile
DESTDIR="$PKG" meson install --no-rebuild --quiet
'''

[sbom]
# As Fedora's package states it (2026-10-13).
license = "LGPL-2.1-or-later"
cpe = ["cpe:2.3:a:gnome:glib"]

[files]
image = [
  "usr/bin/gapplication",
  "usr/bin/gdbus",
  "usr/bin/gio",
  "usr/bin/gio-querymodules",
  "usr/bin/gsettings",
  "usr/lib/libgio-2.0.so.*",
  "usr/lib/libglib-2.0.so.*",
  "usr/lib/libgmodule-2.0.so.*",
  "usr/lib/libgobject-2.0.so.*",
  "usr/lib/libgthread-2.0.so.*",
  "usr/libexec/gio-launch-desktop",
  "usr/share/bash-completion/**",
  "usr/share/glib-2.0/**",
]
build = [
  { path = "usr/share/gdb/**", why = "gdb's pretty printers: Beize has no gdb" },
  { path = "usr/bin/gdbus-codegen", why = "build tool (Python)" },
  { path = "usr/bin/gi-*", why = "introspection tools: nothing uses language bindings" },
  { path = "usr/bin/glib-compile-*", why = "build tools" },
  { path = "usr/bin/glib-genmarshal", why = "build tool (Python)" },
  { path = "usr/bin/glib-gettextize", why = "build tool" },
  { path = "usr/bin/glib-mkenums", why = "build tool (Python)" },
  { path = "usr/bin/gobject-query", why = "development tool" },
  { path = "usr/bin/gresource", why = "development tool" },
  { path = "usr/bin/gtester*", why = "test tools" },
  { path = "usr/lib/libgirepository-2.0.so*", why = "introspection: nothing uses language bindings" },
]
