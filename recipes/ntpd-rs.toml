# ntpd-rs: time synchronization with NTS (authenticated time, RFC 8915),
# written in Rust (ADR 0012). Built without its defaults: TLS and NTS
# cryptography come from the system's OpenSSL instead of aws-lc (a second,
# large C crypto library); no DNSSEC SRV lookups (hickory) and no PPS.
name = "ntpd-rs"
version = "1.9.0"
stage = "target"
deps = ["gcc", "glibc", "gcc-runtime", "openssl"]

# The release tags are lightweight; the release commit is SSH-signed.
[source]
latest = { release-monitoring = 370767 }
git = "https://github.com/pendulum-project/ntpd-rs.git"
tag = "v{version}"
commit = "46ec9bb4d5b6cb24f814f5543d85b9138afb4cba"
keyring = "ntpd-rs"

# Crates moved on from ntpd-rs 1.9.0's Cargo.lock to the releases that fix
# RustSec advisories (#37), until ntpd-rs releases with them: compatible
# patch releases, as distributions build against their fixed crates.
[cargo.update]
rustls = { version = "0.23.46", why = "RUSTSEC-2026-0285, -0346, -0348, -0349" }
crossbeam-epoch = { version = "0.9.20", why = "RUSTSEC-2026-0204" }
webpki-root-certs = { version = "1.0.10", why = "RUSTSEC-2026-0383 (in the lock only, not linked with --features openssl)" }

[build]
script = '''
# openssl-sys: link against the sysroot's OpenSSL; its build script reads
# the headers with $CC (the cross compiler).
export OPENSSL_LIB_DIR="$SYSROOT/usr/lib" OPENSSL_INCLUDE_DIR="$SYSROOT/usr/include"
"$CARGO" fetch --locked --manifest-path "$SRC/Cargo.toml"
select="--manifest-path $SRC/Cargo.toml -p ntpd --no-default-features --features openssl \
  --target x86_64-unknown-linux-gnu"
MAKEFLAGS="$JOBSERVER" "$CARGO" build --offline --locked --release $select
for bin in ntp-daemon ntp-ctl; do
  install -D -m 755 "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/$bin" "$PKG/usr/bin/$bin"
done
# The crates this build linked, for the SBOM (ADR 0022), as Fedora's
# %cargo_vendor_manifest: from crates.io, by name and version (ntpd-rs's own
# crates, by path, are this package), with the source's Cargo.lock for their
# checksums. In usr/lib/beize-build, which is never shipped.
crates="$PKG/usr/lib/beize-build/crates"
mkdir -p "$crates"
"$CARGO" tree --offline --locked $select -e normal,build --prefix none --no-dedupe \
  --format '{p}' | grep -v ' (' | sed 's/ v/ /' | sort -u > "$crates/ntpd-rs.txt"
cp "$SRC/Cargo.lock" "$crates/ntpd-rs.lock"
'''

[sbom]
# As the project states it (Cargo.toml).
license = "Apache-2.0 OR MIT"
cpe = ["cpe:2.3:a:tweedegolf:ntpd-rs"]
# Its crates, checked against RustSec by `bz cve`.
cargo-lock = "Cargo.lock"

[files]
image = [
  "usr/bin/ntp-ctl",
  "usr/bin/ntp-daemon",
]
