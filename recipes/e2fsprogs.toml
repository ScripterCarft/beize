# ext4 tools. systemd-repart formats the root partition with mkfs.ext4 on
# first boot; e2fsck checks it.
name = "e2fsprogs"
version = "1.47.4"
stage = "target"
deps = ["gcc", "glibc", "util-linux"]

[source]
latest = { release-monitoring = 646 }
url = "https://cdn.kernel.org/pub/linux/kernel/people/tytso/e2fsprogs/v{version}/e2fsprogs-{version}.tar.xz"
sha256 = "fd5bf388cbdbe006a3d3b318d983b2948382440acc85a87f1e7d108653e8db0b"
signature = "https://cdn.kernel.org/pub/linux/kernel/people/tytso/e2fsprogs/v{version}/e2fsprogs-{version}.tar.sign"
signed = "uncompressed"
keyring = "e2fsprogs"

[build]
script = '''
# libuuid and libblkid come from util-linux.
"$SRC/configure" \
  --host="$TARGET" --build="$("$SRC/config/config.guess")" \
  --prefix=/usr --libdir=/usr/lib --sbindir=/usr/bin --sysconfdir=/etc \
  --enable-elf-shlibs --disable-nls \
  --disable-libuuid --disable-libblkid --disable-uuidd --disable-fsck \
  --disable-e2initrd-helper --disable-fuse2fs --without-libarchive \
  --with-systemd-unit-dir=/usr/lib/systemd/system \
  --with-udev-rules-dir=/usr/lib/udev/rules.d --without-crond-dir
MAKEFLAGS="$JOBSERVER" make
make DESTDIR="$PKG" install
# mke2fs.conf defaults are compiled in; the sample in /etc is not needed.
rm -rf "$PKG/etc"
'''

[sbom]
# As Fedora's package states it (2026-10-13).
license = "GPL-2.0-only"
cpe = ["cpe:2.3:a:e2fsprogs_project:e2fsprogs"]

[files]
image = [
  "usr/bin/chattr",
  "usr/bin/dumpe2fs",
  "usr/bin/e2fsck",
  "usr/bin/e2label",
  "usr/bin/e2scrub",
  "usr/bin/e2scrub_all",
  "usr/bin/fsck.ext2",
  "usr/bin/fsck.ext3",
  "usr/bin/fsck.ext4",
  "usr/bin/logsave",
  "usr/bin/lsattr",
  "usr/bin/mke2fs",
  "usr/bin/mkfs.ext2",
  "usr/bin/mkfs.ext3",
  "usr/bin/mkfs.ext4",
  "usr/bin/resize2fs",
  "usr/bin/tune2fs",
  "usr/lib/libcom_err.so.*",
  "usr/lib/libe2p.so.*",
  "usr/lib/libext2fs.so.*",
  "usr/lib/libss.so.*",
  "usr/lib/systemd/**",
  "usr/lib/udev/**",
  "usr/libexec/e2fsprogs/**",
]
build = [
  { path = "usr/bin/badblocks", why = "surface scan for floppies and old disks; SSDs remap themselves" },
  { path = "usr/bin/compile_et", why = "build tool (error tables)" },
  { path = "usr/bin/debugfs", why = "file system debugger" },
  { path = "usr/bin/e2freefrag", why = "diagnostic tool" },
  { path = "usr/bin/e2image", why = "file system debugging (metadata images)" },
  { path = "usr/bin/e2mmpstatus", why = "multi-mount protection, for shared cluster disks" },
  { path = "usr/bin/e2undo", why = "replays undo files, which Beize never writes" },
  { path = "usr/bin/e4crypt", why = "ext4's own encryption: Beize encrypts with LUKS (ADR 0009)" },
  { path = "usr/bin/e4defrag", why = "diagnostic tool; ext4 on SSDs is not defragmented" },
  { path = "usr/bin/filefrag", why = "diagnostic tool" },
  { path = "usr/bin/mk_cmds", why = "build tool (command tables)" },
  { path = "usr/bin/mklost+found", why = "mke2fs creates lost+found" },
  { path = "usr/share/et/**", why = "templates of compile_et" },
  { path = "usr/share/ss/**", why = "templates of mk_cmds" },
]
