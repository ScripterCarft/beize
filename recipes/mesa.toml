[build]
script = '''
# Each crate gets the Meson build file Mesa ships for it, as Meson does
# when it sets up a wrap itself.
for wrap in "$SRC"/subprojects/*-rs.wrap; do
  dir=$(sed -n 's/^directory = //p' "$wrap")
  if [ -d "$SRC/subprojects/$dir" ]; then
    cp -r "$SRC/subprojects/packagefiles/$(basename "$wrap" .wrap)/." "$SRC/subprojects/$dir/"
  fi
done
# LLVM as Mesa's "binary wrap" (docs/meson.rst) instead of llvm-config,
# which is a program for Beize and cannot run on the build machine: the
# shared libLLVM and its headers from the sysroot, with LLVM's own
# preprocessor flags (what llvm-config --cppflags names).
llvm_version=$(sed -n 's/^#define LLVM_VERSION_STRING "\(.*\)"$/\1/p' \
  "$SYSROOT/usr/include/llvm/Config/llvm-config.h")
mkdir -p "$SRC/subprojects/llvm"
cat > "$SRC/subprojects/llvm/meson.build" <<MESON
project('llvm', ['cpp'], version : '$llvm_version')
dep_llvm = declare_dependency(
  dependencies : meson.get_compiler('cpp').find_library('LLVM'),
  compile_args : ['-D_GNU_SOURCE', '-D__STDC_CONSTANT_MACROS',
                  '-D__STDC_FORMAT_MACROS', '-D__STDC_LIMIT_MACROS'],
  version : meson.project_version(),
)
has_rtti = true
MESON
meson setup . "$SRC" --cross-file "$MESON_CROSS" --native-file "$MESON_NATIVE" \
  -Dbuild.pkg_config_path="$TOOLS/lib/pkgconfig" \
  --prefix=/usr --libdir=/usr/lib --buildtype=release -Db_ndebug=true \
  -Dauto_features=disabled --wrap-mode=nodownload --force-fallback-for=llvm \
  -Dplatforms=wayland -Dvulkan-drivers=nouveau,swrast -Dgallium-drivers= \
  -Dmesa-clc=system -Dllvm=enabled -Dshared-llvm=enabled \
  -Dglx=disabled -Degl=disabled -Dgbm=disabled -Dopengl=false -Dgles1=disabled -Dgles2=disabled \
  -Dxmlconfig=enabled -Dexpat=enabled -Dzstd=enabled -Dshader-cache=enabled \
  -Dvulkan-layers= -Dtools= -Dvideo-codecs= -Dbuild-tests=false
MAKEFLAGS="$JOBSERVER" meson compile
DESTDIR="$PKG" meson install --no-rebuild --quiet
'''

[sbom]
# As Fedora's package states it (2026-10-17).
license = "MIT AND BSD-3-Clause AND SGI-B-2.0"
cpe = ["cpe:2.3:a:mesa3d:mesa"]

[files]
image = [
  "usr/lib/libvulkan_lvp.so",
  "usr/lib/libvulkan_nouveau.so",
  "usr/share/drirc.d/**",
  "usr/share/vulkan/icd.d/lvp_icd.x86_64.json",
  "usr/share/vulkan/icd.d/nouveau_icd.x86_64.json",
]
