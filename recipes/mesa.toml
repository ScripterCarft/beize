# Mesa: the GPU drivers for Vulkan (ADR 0027). NVK, Mesa's Vulkan driver
# for NVIDIA (Turing and newer, through the GSP firmware the nouveau kernel
# driver loads) – as Fedora Workstation ships it; and lavapipe, Vulkan on
# the CPU, for machines without a Vulkan GPU (VMs, CI) as Windows has WARP.
# Vulkan only: no OpenGL, EGL or GBM until something in Beize needs them
# (OpenGL will come through zink, as Mesa does for NVK). The Wayland
# surface for applications; drirc for per-application driver settings.
name = "mesa"
version = "26.2.5"
stage = "target"
# mesa-clc: NVK's OpenCL C kernels, compiled while building. expat:
# drirc (xmlconfig). zstd: the shader cache, compressed as Fedora's.
# gcc-runtime: libstdc++ of the C++ parts. elfutils: NVK reads the ELF
# images of its shaders with libelf. llvm: lavapipe's JIT.
deps = ["gcc", "glibc", "gcc-runtime", "libdrm", "wayland", "wayland-protocols",
        "wayland-scanner", "mesa-clc", "expat", "zlib", "zstd", "elfutils", "llvm"]

[source]
latest = { release-monitoring = 1970 }
url = "https://archive.mesa3d.org/mesa-{version}.tar.xz"
sha256 = "794b3d1729075dae7ebd47c7283b7ca0cdb5dec668f7f11cc0a5d82f6138a0a5"
signature = "https://archive.mesa3d.org/mesa-{version}.tar.xz.sig"
keyring = "mesa"

# The crates of NVK's Rust compiler, as Mesa's wraps name them (checked
# against the wrap on every unpack): from crates.io, pinned by the SHA-256
# that Mesa's signed archive carries.
