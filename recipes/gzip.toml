# GNU gzip and its z* helpers (zcat, zgrep, zless, ...).
name = "gzip"
version = "1.15"
stage = "target"
deps = ["gcc", "glibc"]

[source]
latest = { release-monitoring = 1290 }
url = "https://mirrors.kernel.org/gnu/gzip/gzip-{version}.tar.xz"
sha256 = "9aa0cc780dec156b8282844833b342ab7cb08c25d2cd9a1869cdd0df31deff48"
signature = "https://mirrors.kernel.org/gnu/gzip/gzip-{version}.tar.xz.sig"
keyring = "gzip"

[build]
script = '''
"$SRC/configure" \
  --host="$TARGET" --build="$("$SRC/build-aux/config.guess")" --prefix=/usr
MAKEFLAGS="$JOBSERVER" make
make DESTDIR="$PKG" install
'''

[sbom]
# As Fedora's package states it (2026-10-15).
license = "GPL-3.0-or-later AND GFDL-1.3-only"
cpe = ["cpe:2.3:a:gnu:gzip"]

[files]
image = [
  "usr/bin/gunzip",
  "usr/bin/gzip",
  "usr/bin/uncompress",
  "usr/bin/zcat",
  "usr/bin/zcmp",
  "usr/bin/zdiff",
  "usr/bin/zegrep",
  "usr/bin/zfgrep",
  "usr/bin/zgrep",
  "usr/bin/zmore",
]
build = [
  { path = "usr/bin/gzexe", why = "compresses executables" },
  { path = "usr/bin/zforce", why = "renames .gz files of old file systems" },
  { path = "usr/bin/znew", why = "converts .Z files to .gz" },
]
