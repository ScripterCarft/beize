# Only libdevmapper from LVM2: the device-mapper interface cryptsetup uses
# for dm-verity and dm-crypt, plus its udev rules. LVM itself is not built.
name = "lvm2"
version = "2.03.43"
stage = "target"
# libdevmapper is built without udev synchronisation: systemd needs
# libcryptsetup, which needs libdevmapper, so libdevmapper must not link
# systemd's libudev. The udev rules are still installed – they are plain
# files, and without them /dev/mapper/* devices never become ready for systemd.
deps = ["gcc", "glibc", "util-linux"]

[source]
url = "https://sourceware.org/pub/lvm2/LVM2.{version}.tgz"
sha256 = "d87ec0dac9061f1fa58ebced5c6b1360c87d4c5cd7b455dc0ebe1d3f036920d7"
signature = "https://sourceware.org/pub/lvm2/LVM2.{version}.tgz.asc"
keyring = "lvm2"

[build]
script = '''
# The malloc/realloc checks cannot run when cross compiling; glibc behaves.
"$SRC/configure" \
  --host="$TARGET" --prefix=/usr --libdir=/usr/lib --sbindir=/usr/bin \
  --with-confdir=/etc --with-udevdir=/usr/lib/udev/rules.d \
  --disable-udev_sync --enable-udev_rules --enable-pkgconfig \
  --disable-readline --disable-selinux --disable-dmeventd --disable-cmdlib \
  ac_cv_func_malloc_0_nonnull=yes ac_cv_func_realloc_0_nonnull=yes
make -j"$JOBS" device-mapper
make DESTDIR="$PKG" install_device-mapper
'''
