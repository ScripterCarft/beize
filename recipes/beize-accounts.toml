# The one interface for people's accounts (os/beize-accounts, ADR 0019), and
# `beize-account` on the console: change your password, reset a forgotten
# one in the recovery. beize-setup links the same library.
name = "beize-accounts"
version = "0.1.0"
stage = "target"
# libgcc_s for Rust's unwinding; libxcrypt hashes passwords; libsystemd
# (sd-bus) talks to homed.
deps = ["gcc", "glibc", "gcc-runtime", "libxcrypt", "systemd"]
repo = ["os/beize-accounts", "Cargo.toml", "Cargo.lock"]

[build]
script = '''
"$CARGO" fetch --locked --manifest-path "$REPO/Cargo.toml"
"$CARGO" build --offline --locked --release --manifest-path "$REPO/Cargo.toml" \
  -p beize-accounts --target x86_64-unknown-linux-gnu
install -D -m 755 "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/beize-account" \
  "$PKG/usr/bin/beize-account"
'''
