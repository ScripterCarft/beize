# systemd: init, device management, logging (ADR 0002).
# Every optional feature starts disabled; enable them deliberately.
# Nothing is installed to /etc: Beize ships only /usr (ADR 0007).
# No systemd-firstboot: first-boot setup will be Beize's own onboarding;
# until then the defaults apply (UTC, C.UTF-8, no root password prompt).
# Network (networkd + resolved, ADR 0011): nss-resolve for name lookups; no
# compiled-in fallback DNS or NTP servers – Beize contacts no third party the
# network did not name. LLMNR is off (spoofable, superseded by mDNS).
# No timesyncd: time comes from ntpd-rs with NTS (ADR 0012).
name = "systemd"
version = "262"
stage = "target"
# linux-pam: user sessions (pam_systemd, user@.service). kmod: udev loads
# drivers (ADR 0015). acl: device access for the logged-in user (uaccess),
# users reading their own journal. libxkbcommon: localed checks a keyboard
# layout against XKB before accepting it (dlopen, ADR 0017). polkit: systemd
# asks polkitd over D-Bus whether a user may act (run0, ADR 0018); without
# the option it refuses everyone but root. It needs no polkit library.
# libseccomp: units' system call filters and related sandboxing
# (SystemCallFilter=, RestrictAddressFamilies=, ...) – without it systemd
# ignores them silently.
# curl, xz, zlib: systemd builds systemd-sysupdate, which writes updates into
# the free /usr slot (ADR 0020), only together with importd, which requires
# them. Of importd only systemd-import stays (sysupdate writes a partition
# with it). zstd: with xz present, systemd would compress the journal and
# core dumps with xz by default; zstd is far faster and what Fedora uses.
deps = ["gcc", "glibc", "libcap", "util-linux", "cryptsetup", "openssl", "tpm2-tss", "linux-pam",
        "kmod", "acl", "libxkbcommon", "libseccomp", "curl", "xz", "zlib", "zstd"]

# systemd publishes no signed tarballs; release tags are signed instead.
[source]
latest = { release-monitoring = 5440 }
git = "https://github.com/systemd/systemd.git"
tag = "v{version}"
commit = "8cc40e0c5e9234bf45084751ac53b1fbfe70b492"
keyring = "systemd"

[build]
script = '''
meson setup . "$SRC" --cross-file "$MESON_CROSS" --native-file "$MESON_NATIVE" \
  --prefix=/usr --libdir=/usr/lib --sbindir=/usr/bin --buildtype=release \
  -Dmode=release -Dauto_features=disabled \
  -Dblkid=enabled -Dlibmount=enabled -Dfdisk=enabled -Drepart=enabled \
  -Dlibcryptsetup=enabled \
  -Dopenssl=enabled -Dtpm2=enabled \
  -Dkmod=enabled -Dacl=enabled -Dxkbcommon=enabled -Dpolkit=enabled -Dseccomp=enabled \
  -Dpam=enabled -Dpamconfdir=/usr/lib/pam.d -Dpamlibdir=/usr/lib/security \
  -Dtests=false -Dinstall-tests=false \
  -Ddefault-dnssec=no \
  -Dnss-resolve=enabled \
  -Ddns-servers= -Dntp-servers= -Dtimesyncd=false \
  -Ddefault-llmnr=no \
  -Dinstall-sysconfdir=false -Dfallback-hostname=beize \
  -Dfirstboot=false \
  -Dbootloader=enabled \
  -Dsysupdate=enabled -Dsysupdated=disabled -Dimportd=enabled \
  -Dlibcurl=enabled -Dxz=enabled -Dzlib=enabled -Dzstd=enabled -Ddefault-compression=zstd \
  -Dsbat-distro=beize -Dsbat-distro-summary=Beize \
  -Dsbat-distro-pkgname=systemd -Dsbat-distro-version="$VERSION" \
  -Dsbat-distro-url=https://github.com/ScripterCarft/beize
MAKEFLAGS="$JOBSERVER" meson compile
DESTDIR="$PKG" meson install --no-rebuild --quiet
# importd comes only because sysupdate requires it (ADR 0020): sysupdate runs
# systemd-import to write a partition, beize-updated fetches and verifies.
# Downloading machine and OCI images, and the OpenPGP keyring sysupdate's own
# verification would use, are not part of Beize.
(
  cd "$PKG/usr"
  rm bin/importctl share/bash-completion/completions/importctl \
    lib/systemd/systemd-importd lib/systemd/systemd-pull lib/systemd/systemd-export \
    lib/systemd/systemd-import-fs lib/systemd/system-generators/systemd-import-generator \
    lib/systemd/import-pubring.pgp \
    lib/systemd/system/imports.target lib/systemd/system/imports-pre.target \
    lib/systemd/system/sysinit.target.wants/imports.target \
    share/dbus-1/services/org.freedesktop.import1.service \
    share/dbus-1/system-services/org.freedesktop.import1.service \
    share/dbus-1/system.d/org.freedesktop.import1.conf \
    share/polkit-1/actions/org.freedesktop.import1.policy
  for dir in system user; do
    rm lib/systemd/$dir/systemd-importd.service lib/systemd/$dir/systemd-importd.socket \
      lib/systemd/$dir/sockets.target.wants/systemd-importd.socket \
      lib/systemd/$dir/dbus-org.freedesktop.import1.service
  done
  rm -r lib/systemd/oci-registry
  # sysupdate's Varlink interface is enabled statically (a link, no preset
  # can disable it). beize-updated is the one way to update the system; a
  # second interface around it would bypass its checks.
  rm lib/systemd/system/sockets.target.wants/systemd-sysupdate.socket
)
# ukify builds the UKI on the build host. It must be the same version as the
# stub and as systemd in the image (e.g. the signed PCR policies systemd 262
# expects), so it comes from here, into a directory that is never shipped.
meson compile ukify
install -Dm755 ukify "$PKG/usr/lib/beize-build/ukify"
'''

[sbom]
# As Fedora's package states it (2026-10-13).
license = "LGPL-2.1-or-later AND MIT AND GPL-2.0-or-later"
cpe = ["cpe:2.3:a:systemd_project:systemd", "cpe:2.3:a:freedesktop:systemd"]

