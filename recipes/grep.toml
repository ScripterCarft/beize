# GNU grep, with Perl-compatible expressions (grep -P) through PCRE2, as
# Fedora and Debian build it.
name = "grep"
version = "3.12"
stage = "target"
# Requested explicitly, so configure fails instead of building without -P.
deps = ["gcc", "glibc", "pcre2"]

[source]
latest = { release-monitoring = 1251 }
url = "https://mirrors.kernel.org/gnu/grep/grep-{version}.tar.xz"
sha256 = "2649b27c0e90e632eadcd757be06c6e9a4f48d941de51e7c0f83ff76408a07b9"
signature = "https://mirrors.kernel.org/gnu/grep/grep-{version}.tar.xz.sig"
keyring = "grep"

[build]
script = '''
"$SRC/configure" \
  --host="$TARGET" --build="$("$SRC/build-aux/config.guess")" --prefix=/usr \
  --disable-nls --enable-perl-regexp
MAKEFLAGS="$JOBSERVER" make
make DESTDIR="$PKG" install
'''

[sbom]
# As Fedora's package states it (2026-10-15).
license = "GPL-3.0-or-later AND LGPL-3.0-or-later AND LGPL-2.1-or-later AND GPL-2.0-or-later AND LGPL-2.0-or-later AND GFDL-1.3-no-invariants-or-later"
cpe = ["cpe:2.3:a:gnu:grep"]

[files]
image = [
  "usr/bin/egrep",
  "usr/bin/fgrep",
  "usr/bin/grep",
]
