# Runtime libraries shipped by gcc (libgcc_s, libstdc++).
# glibc loads libgcc_s for thread cancellation, so every system needs it.
name = "gcc-runtime"
version = "16.2.0"
stage = "target"
deps = ["gcc"]

[build]
script = '''
mkdir -p "$PKG/usr/lib"
cp -a "$TOOLS/$TARGET"/lib/libgcc_s.so.1 "$PKG/usr/lib/"
cp -a "$TOOLS/$TARGET"/lib/libstdc++.so.6* "$PKG/usr/lib/"
rm -f "$PKG"/usr/lib/*.py
'''

[sbom]
# The part of the package Beize ships; licenses as Fedora states them.
license = "GPL-3.0-or-later WITH GCC-exception-3.1"
cpe = ["cpe:2.3:a:gnu:gcc"]

[files]
# libstdc++ since Mesa, the first C++ in Beize (and elfutils' demangler).
image = [
  "usr/lib/libgcc_s.so.*",
  "usr/lib/libstdc++.so.*",
]
