[package]
name = "beize-fuzz"
description = "Fuzzers for what unprivileged callers send Beize's services (ci/fuzz.sh)"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
beize-update = { path = "../os/beize-update" }
beize-varlink = { path = "../os/beize-varlink" }
# beize-tpm's parsers (firmware target), as beize-tpm has it.
sha2 = "0.11.0"

# Not part of the main workspace: it needs a nightly compiler (sanitizers).
[workspace]

[[bin]]
name = "varlink_request"
path = "fuzz_targets/varlink_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "firmware"
path = "fuzz_targets/firmware.rs"
test = false
doc = false
bench = false

[[bin]]
name = "update_list"
path = "fuzz_targets/update_list.rs"
test = false
doc = false
bench = false
