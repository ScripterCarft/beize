# What Beize's Rust code may depend on, checked by cargo-deny in the CI's
# check job (the buildroot has it, ADR 0021). A dependency that breaks a rule
# fails the check; an exception goes here with its reason.

[graph]
all-features = true

# RustSec's advisories: known vulnerabilities, unsound and unmaintained
# crates, and yanked versions all fail.
[advisories]
yanked = "deny"
unmaintained = "all"
ignore = [
  # Unmaintained, not a vulnerability: Smithay 0.7 uses it for matrix
  # helpers of its renderer, on no outside input. Smithay's main branch has
  # dropped it (checked 2026-10-21); the entry goes with Smithay's next
  # release.
  { id = "RUSTSEC-2026-0196", reason = "cgmath through Smithay 0.7, dropped upstream" },
]

# Permissive licenses only, as the crates in use have them (checked
# 2026-10-13); Beize's own crates are not published and carry none. ISC
# (libloading, through ash, 2026-10-21) is MIT's equal in substance.
[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Unlicense", "ISC"]
confidence-threshold = 0.93

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Beize's crates depend on each other by path, within this repository.
allow-wildcard-paths = true

# Crates only from crates.io: their versions and checksums are in Cargo.lock.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
