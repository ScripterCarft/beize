# What Beize's Rust code may depend on, checked by cargo-deny in the CI's
# check job (the buildroot has it, ADR 0021). A dependency that breaks a rule
# fails the check; an exception goes here with its reason.

[graph]
all-features = true

# RustSec's advisories: known vulnerabilities, unsound and unmaintained
# crates, and yanked versions all fail.
[advisories]
yanked = "deny"
unmaintained = "all"
ignore = [
  # Unmaintained, not a vulnerability: Smithay 0.7 uses it for matrix
  # helpers of its renderer, on no outside input. Smithay's main branch has
  # dropped it (checked 2026-10-21); the entry goes with Smithay's next
  # release.
  { id = "RUSTSEC-2026-0196", reason = "cgmath through Smithay 0.7, dropped upstream" },
]

# Permissive licenses only, as the crates in use have them (checked
# 2026-10-13); Beize's own crates are not published and carry none. ISC
# (libloading, through ash, 2026-10-21) is MIT's equal in substance; Zlib
# (foldhash, through Parley's font collection, 2026-10-22) is as permissive,
# the license of zlib itself. BSD-2-Clause and BSD-3-Clause (arrayref and
# tiny-skia, through resvg for the symbols, 2026-10-23) ask for the notice
# only, as MIT does; the third clause forbids using the authors' names.
[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Unlicense", "ISC", "Zlib", "BSD-2-Clause", "BSD-3-Clause"]
confidence-threshold = 0.93

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Beize's crates depend on each other by path, within this repository.
allow-wildcard-paths = true
# Beize's layers (CLAUDE.md §5): each crate may be used only by those named
# (`wrappers`) – a new user is a decision, made here. Graphics: beize-vulkan
# below beize-draw below Beize UI and the compositor; Wayland's client side
# only in Beize UI and the test client, Smithay only in the compositor.
# The system's services share beize-varlink, the desktop's beize-systemd;
# bz uses none of them.
deny = [
  { crate = "smithay", wrappers = ["beize-compositor"], reason = "the compositor alone speaks Wayland's server side (ADR 0027)" },
  { crate = "wayland-client", wrappers = ["beize-ui", "beize-testclient", "beize-protocols", "wayland-protocols", "wayland-protocols-wlr"], reason = "apps reach Wayland through Beize UI (ADR 0027 §9)" },
  { crate = "ash", wrappers = ["beize-vulkan", "beize-ui", "smithay"], reason = "Vulkan through beize-vulkan; Beize UI loads it for its windows" },
  { crate = "beize-vulkan", wrappers = ["beize-draw", "beize-ui", "beize-compositor"], reason = "the GPU ground of Beize UI and the compositor" },
  { crate = "beize-draw", wrappers = ["beize-ui", "beize-compositor"], reason = "what Beize UI and the compositor draw alike (ADR 0028 §2)" },
  { crate = "beize-ui", wrappers = ["beize-shell", "beize-terminal"], reason = "the toolkit of Beize's apps; the compositor draws without it" },
  { crate = "beize-protocols", wrappers = ["beize-ui", "beize-compositor"], reason = "Beize's own protocols, between the shell and the compositor" },
  { crate = "beize-systemd", wrappers = ["beize-compositor", "beize-session", "beize-shell"], reason = "the desktop's way into logind and the user's service manager" },
  { crate = "beize-varlink", wrappers = ["beize-accounts", "beize-update"], reason = "the system services' Varlink" },
  { crate = "beize-accounts", wrappers = ["beize-setup"], reason = "the account service's client, for the first start" },
]

# Crates only from crates.io: their versions and checksums are in Cargo.lock.
# One exception until Smithay's next release: its 0.7.0 with Beize's upstream
# fix, at a fixed commit (Cargo.toml `[patch.crates-io]`, ADR 0027 §1).
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/ScripterCarft/smithay"]
