name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, to notice when an upstream download or signature changes.
    - cron: "17 4 * * 1"

# The workflow only reads the repository; caches and artifacts use the
# runner's own token.
permissions:
  contents: read

# A newer push to the same branch makes older runs pointless: cancel them
# instead of letting several multi-hour builds run side by side.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same version and components as rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # beize-tpm links libcryptsetup, beize-accounts libsystemd
      # (ci/packages.txt); the runner image has libcrypt-dev for beize-setup,
      # but not these.
      - name: Install libcryptsetup-dev and libsystemd-dev
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libcryptsetup-dev libsystemd-dev >/dev/null
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  system:
    name: Build and boot
    needs: check
    # The full build takes a while; run it for main, by hand and weekly.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      # Docker's official ubuntu image via AWS's mirror (same digest): Docker
      # Hub refused anonymous pulls from the runners (rate limit).
      image: public.ecr.aws/docker/library/ubuntu:26.04
      # Privileged for user namespaces (image assembly) and /dev/kvm (boot test).
      options: --privileged --device /dev/kvm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actions/cache picks zstd or gzip depending on what is installed, and a
      # cache saved with one is invisible to a restore with the other. ci/system.sh
      # installs zstd, so without this step every restore (gzip) missed every
      # save (zstd) and each run rebuilt the whole system from scratch.
      - name: Install cache compression
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends zstd >/dev/null
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cache
          key: sources-${{ hashFiles('recipes/*.toml') }}
          restore-keys: sources-
      # Built packages (cross toolchain, sysroot, ownership manifests, stamps)
      # and the kernel object tree. bz's fingerprints decide what is still up
      # to date, so restoring an older state is safe: only what changed is
      # rebuilt. Saved after every run, also a failed or cancelled one, so a
      # long first build is never lost. sysroot-hidden holds what a build that
      # was cut off had hidden from the sysroot; bz puts it back on the next run.
      - name: Restore build state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/tools
            build/sysroot
            build/sysroot-hidden
            build/manifests
            build/work/stamps
            build/work/linux-obj
          key: build-${{ hashFiles('recipes/*.toml', 'kernel/**', 'tools/bz/src/**') }}-${{ github.run_id }}
          restore-keys: |
            build-${{ hashFiles('recipes/*.toml', 'kernel/**', 'tools/bz/src/**') }}-
            build-
      - run: ci/system.sh
      - name: Save build state
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/tools
            build/sysroot
            build/sysroot-hidden
            build/manifests
            build/work/stamps
            build/work/linux-obj
          key: build-${{ hashFiles('recipes/*.toml', 'kernel/**', 'tools/bz/src/**') }}-${{ github.run_id }}
      - name: Upload disk image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beize-disk-image
          path: build/out/disk.img
          retention-days: 7
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs
          path: build/work/logs/
          retention-days: 7
