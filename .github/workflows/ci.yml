name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, to notice when an upstream download or signature changes.
    - cron: "17 4 * * 1"

# The workflow only reads the repository and the build container
# (mirror.yml); caches and artifacts use the runner's own token.
permissions:
  contents: read
  packages: read

# A newer push to the same branch makes older runs pointless: cancel them
# instead of letting several multi-hour builds run side by side.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    # The build host's Ubuntu (ADR 0004), as for the build below: the tests
    # link the host's libraries, and libsystemd's sd-json (beize-accounts)
    # needs systemd 257 – the runner image has 255.
    container:
      image: ghcr.io/scriptercarft/beize-build:ubuntu-26.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build host's packages (ci/packages.txt, as ci/system.sh installs
      # them): the tests link its libraries and run its tools. curl for
      # rustup; zstd before any cache is restored (see the build job).
      - name: Install build host packages
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl zstd >/dev/null
          grep -vE '^\s*(#|$)' ci/packages.txt \
            | xargs apt-get install -y -qq --no-install-recommends >/dev/null
      # Same version and components as rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  system:
    name: Build and boot
    needs: check
    # The full build takes a while; run it for main, by hand and weekly.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      # Ubuntu's official image, pinned by digest in this repository's
      # registry (mirror.yml): anonymous pulls from Docker Hub and AWS's
      # mirror failed on their limits.
      image: ghcr.io/scriptercarft/beize-build:ubuntu-26.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Privileged for user namespaces (image assembly) and /dev/kvm (boot test).
      options: --privileged --device /dev/kvm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actions/cache picks zstd or gzip depending on what is installed, and a
      # cache saved with one is invisible to a restore with the other. ci/system.sh
      # installs zstd, so without this step every restore (gzip) missed every
      # save (zstd) and each run rebuilt the whole system from scratch. curl
      # for rustup.
      - name: Install cache compression
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl zstd >/dev/null
      # Same toolchain as rust-toolchain.toml; bz's own build is cached, so
      # ci/system.sh starts building Beize at once.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Downloaded sources, named by their pins (sha256 or commit) rather than
      # by the recipes: a recipe change that keeps its sources keeps the
      # cache. Not linux-firmware (632 MB): only the microcode comes from it,
      # and that is kept with the build state below; bz downloads it when the
      # microcode changes and for the weekly verification.
      - name: Name the sources
        id: sources
        run: |
          pins=$(grep -h -E '^\s*(sha256|commit)\s*=' recipes/*.toml | sort | sha256sum | cut -c1-16)
          echo "key=sources-$pins" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/cache
            !build/cache/linux-firmware-*.tar.xz
          key: ${{ steps.sources.outputs.key }}
          restore-keys: sources-
      # Built packages (cross toolchain, sysroot, ownership manifests, stamps),
      # the kernel object tree and the microcode. bz's fingerprints decide what
      # is still up to date, so restoring an older state is safe: only what
      # changed is rebuilt.
      # The weekly run starts from nothing, so a build from scratch keeps
      # working (it broke once unnoticed: glibc's configure needed an old libc).
      - name: Restore build state
        id: restore
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/tools
            build/sysroot
            build/manifests
            build/work/stamps
            build/work/linux-obj
            build/work/microcode.cpio
          key: build-
          restore-keys: build-
      # The weekly run checks every source's signature again, to notice when
      # an upstream download or signature changes; on other runs the build
      # verifies new sources itself.
      - run: ci/system.sh
        env:
          VERIFY_SOURCES: ${{ github.event_name != 'push' }}
      # Named by the stamps of what it holds, so a run that rebuilt nothing
      # saves nothing; saved also after a failed or cancelled run, so a long
      # build is never lost.
      - name: Name the build state
        id: state
        if: always()
        run: |
          echo "key=build-${{ hashFiles('build/work/stamps/*', '!build/work/stamps/step-usr', '!build/work/stamps/step-initrd', '!build/work/stamps/step-image') }}" >> "$GITHUB_OUTPUT"
      - name: Save build state
        if: always() && steps.state.outputs.key != 'build-' && steps.state.outputs.key != steps.restore.outputs.cache-matched-key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/tools
            build/sysroot
            build/manifests
            build/work/stamps
            build/work/linux-obj
            build/work/microcode.cpio
          key: ${{ steps.state.outputs.key }}
      # The image for trying it out, when a run is started by hand.
      - name: Upload disk image
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beize-disk-image
          path: build/out/disk.img
          retention-days: 7
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs
          path: build/work/logs/
          retention-days: 7
