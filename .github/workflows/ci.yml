name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, to notice when an upstream download or signature changes.
    - cron: "17 4 * * 1"

# Read the repository and the buildroot image; only the buildroot job writes
# (a new image). Caches and artifacts use the runner's own token.
permissions:
  contents: read
  packages: read

# A newer push to the same branch makes older runs pointless: cancel them
# instead of letting several multi-hour builds run side by side.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILDROOT: ghcr.io/scriptercarft/beize-buildroot

jobs:
  # Beize's buildroot (ADR 0021) as this repository's container image, named
  # by the hash of ci/buildroot/: created only when that changed. The other
  # jobs run in it – the Ubuntu, packages and Rust of a local ./bz.
  buildroot:
    name: Buildroot
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Name the buildroot
        id: name
        run: echo "image=$BUILDROOT:$(ci/buildroot/hash.sh)" >> "$GITHUB_OUTPUT"
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Create the buildroot unless it exists
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "$IMAGE exists"
            exit 0
          fi
          # mmdebstrap of Ubuntu 26.04 (the Ubuntu image pinned in mirror.yml)
          # creates it; what goes in is fixed by packages.lock and checked.
          docker run --rm --privileged -v "$PWD:/w" -w /w \
            ghcr.io/scriptercarft/beize-build:ubuntu-26.04 sh -euc '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends mmdebstrap curl ca-certificates >/dev/null
              ci/buildroot/create.sh /w/buildroot.tar /w/packages > /w/create.log 2>&1 ||
                { tail -n 60 /w/create.log | cut -c 1-300; exit 1; }'
          docker import \
            --change 'ENV PATH=/opt/rust/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' \
            --change 'ENV RUSTUP_HOME=/opt/rust' \
            --change 'ENV LANG=C.UTF-8' \
            buildroot.tar "$IMAGE"
          docker push "$IMAGE"

  check:
    name: Format, lint, test
    needs: buildroot
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.buildroot.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The Rust dependencies: RustSec advisories, licenses, origin (deny.toml).
      - run: cargo deny check

  # Known vulnerabilities of what the image contains (NVD, ADR 0022): weekly
  # and by hand. Red on an unassessed one of CVSS 7.0 or more.
  cve:
    name: Known vulnerabilities
    needs: buildroot
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.buildroot.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: ./bz cve
        env:
          # Optional: with a key the NVD answers ten times as often.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  system:
    name: Build and boot
    needs: [buildroot, check]
    # The full build takes a while; run it for main, by hand and weekly.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: ${{ needs.buildroot.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Privileged for user namespaces (image assembly) and /dev/kvm (boot test).
      options: --privileged --device /dev/kvm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # bz's own build is cached, so ci/system.sh starts building Beize at once.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Downloaded sources, named by their pins (sha256 or commit) rather than
      # by the recipes: a recipe change that keeps its sources keeps the
      # cache. Not linux-firmware (632 MB): only the microcode comes from it,
      # and that is kept with the build state below; bz downloads it when the
      # microcode changes and for the weekly verification.
      - name: Name the sources
        id: sources
        run: |
          pins=$(grep -h -E '^\s*(sha256|commit)\s*=' recipes/*.toml | sort | sha256sum | cut -c1-16)
          echo "key=sources-$pins" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/cache
            !build/cache/linux-firmware-*.tar.xz
          key: ${{ steps.sources.outputs.key }}
          restore-keys: sources-
      # Built packages (cross toolchain, sysroot, ownership manifests, stamps,
      # what each build needed), the kernel object tree and the microcode. bz's
      # fingerprints decide what is still up to date, so restoring an older
      # state is safe: only what changed is rebuilt.
      # The weekly run starts from nothing, so a build from scratch keeps
      # working (it broke once unnoticed: glibc's configure needed an old libc).
      - name: Restore build state
        id: restore
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/tools
            build/sysroot
            build/manifests
            build/work/stamps
            build/work/measured
            build/work/linux-obj
            build/work/microcode.cpio
          key: build-
          restore-keys: build-
      # The weekly run checks every source's signature again, to notice when
      # an upstream download or signature changes; on other runs the build
      # verifies new sources itself.
      - run: ci/system.sh
        env:
          VERIFY_SOURCES: ${{ github.event_name != 'push' }}
      # Named by the stamps of what it holds, so a run that rebuilt nothing
      # saves nothing; saved also after a failed or cancelled run, so a long
      # build is never lost.
      - name: Name the build state
        id: state
        if: always()
        run: |
          echo "key=build-${{ hashFiles('build/work/stamps/*', '!build/work/stamps/step-usr', '!build/work/stamps/step-initrd', '!build/work/stamps/step-image') }}" >> "$GITHUB_OUTPUT"
      - name: Save build state
        if: always() && steps.state.outputs.key != 'build-' && steps.state.outputs.key != steps.restore.outputs.cache-matched-key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/tools
            build/sysroot
            build/manifests
            build/work/stamps
            build/work/measured
            build/work/linux-obj
            build/work/microcode.cpio
          key: ${{ steps.state.outputs.key }}
      # The image for trying it out, when a run is started by hand.
      - name: Upload disk image
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beize-disk-image
          path: build/out/disk.img
          retention-days: 7
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs
          path: build/work/logs/
          retention-days: 7
