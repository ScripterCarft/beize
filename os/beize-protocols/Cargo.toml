[package]
name = "beize-protocols"
description = "Beize's own Wayland protocols, for the compositor and the shell (ADR 0028 §1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
client = ["dep:wayland-client"]
server = ["dep:wayland-server"]

# What wayland-protocols builds its protocols from, in the versions it and
# Smithay already bring (Cargo.lock).
[dependencies]
bitflags = "2"
wayland-backend = "0.3"
wayland-scanner = "0.31"
wayland-client = { version = "0.31", optional = true }
wayland-server = { version = "0.31", optional = true }

[lints]
workspace = true
