[package]
name = "beize-shell"
description = "Beize's shell: menu bar, later dock and control center, with Beize UI (ADR 0028)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
beize-ui = { path = "../beize-ui" }
# The local time: glibc's localtime_r with the zone in /etc/localtime.
libc = "0.2"
# The minute's timer (timerfd), which also hears when the clock is set.
rustix = { version = "1.1", default-features = false, features = ["std", "time"] }
tracing = "0.1"

[lints]
workspace = true
