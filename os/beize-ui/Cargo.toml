[package]
name = "beize-ui"
description = "Beize UI: windows, input, text and drawing for Beize's own apps (ADR 0027 §9)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
beize-vulkan = { path = "../beize-vulkan" }
# Text, symbols, scenes and the title bar, shared with the compositor;
# symbols and icons only here (`icons`).
beize-draw = { path = "../beize-draw", features = ["icons"] }
# ash loads libvulkan.so.1 at run time (loaded), as Smithay does for the
# compositor; debug names Vulkan's values in errors.
ash = { version = "0.38", default-features = false, features = ["debug", "loaded", "std"] }
# libwayland itself (system): Mesa's WSI takes its wl_display and
# wl_surface. Loaded at run time (dlopen) like Vulkan: the desktop has it
# for Mesa anyway, and the buildroot, where CI lints and tests, has none.
wayland-client = { version = "0.31", features = ["system", "dlopen"] }
# The pointer's image by name: cursor-shape-v1 (staging), which names
# tablet tools of tablet-v2 (unstable) too.
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
# Panels of Beize's shell (wlr-layer-shell, ADR 0028 §1); the version
# Smithay serves.
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# The shell's view of the windows (beize-shell-v1, ADR 0028 §1).
beize-protocols = { path = "../beize-protocols", features = ["client"] }
rustix = { version = "1.1", default-features = false, features = ["event", "fs", "pipe", "std"] }
tracing = "0.1"
# An app's log to the journal (`log`), as the compositor writes its own.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }
# Keys (ADR 0027 §9): libxkbcommon with the compositor's keymap and
# Compose; the same crate and version as Smithay's. Linked, not loaded: the
# desktop has it for the compositor, the buildroot to link that.
xkbcommon = { version = "0.8", default-features = false, features = ["wayland"] }

[lints]
workspace = true
