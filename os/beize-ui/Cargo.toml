[package]
name = "beize-ui"
description = "Beize UI: windows, input, text and drawing for Beize's own apps (ADR 0027 §9)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
beize-vulkan = { path = "../beize-vulkan" }
# ash loads libvulkan.so.1 at run time (loaded), as Smithay does for the
# compositor; debug names Vulkan's values in errors.
ash = { version = "0.38", default-features = false, features = ["debug", "loaded", "std"] }
# libwayland itself (system): Mesa's WSI takes its wl_display and
# wl_surface. Loaded at run time (dlopen) like Vulkan: the desktop has it
# for Mesa anyway, and the buildroot, where CI lints and tests, has none.
wayland-client = { version = "0.31", features = ["system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client"] }
rustix = { version = "1.1", default-features = false, features = ["event", "std"] }
tracing = "0.1"
# Text (ADR 0027 §9): Parley lays it out (Fontique, re-exported, holds the
# fonts; without its system feature, which is fontconfig on Linux),
# Skrifa – Parley's own version – gives the hinted outlines, zeno
# rasterizes them.
parley = { version = "0.12", default-features = false, features = ["std"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
zeno = { version = "0.3", default-features = false, features = ["eval", "std"] }

[lints]
workspace = true
